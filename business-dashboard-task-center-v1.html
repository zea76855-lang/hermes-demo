<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>业务部驾驶舱与任务中心 - 交互原型</title>
  <style>
    :root{
      --bg:#f4f7fb; --panel:#ffffff; --panel2:#f8fafc; --text:#162033; --muted:#64748b; --line:#dfe7f2;
      --brand:#ff6b5c; --brand2:#2f6fed; --ok:#1f9d55; --warn:#d97706; --bad:#d92d20; --shadow:0 12px 30px rgba(15,23,42,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
    a{color:inherit;text-decoration:none}
    .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    .sidebar{background:linear-gradient(180deg,#0f172a 0%,#111827 100%);color:#e5eefc;padding:22px 18px;position:sticky;top:0;height:100vh;border-right:1px solid rgba(255,255,255,.08)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#ff8f74);display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 10px 20px rgba(255,107,92,.28)}
    .brand h1{font-size:16px;line-height:1.2;margin:0}.brand p{margin:4px 0 0;color:#9fb0cb;font-size:12px}
    .nav{display:grid;gap:8px;margin-top:18px}
    .nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:12px;color:#dbe6f5;background:transparent;border:1px solid transparent;font-size:14px}
    .nav button:hover{background:rgba(255,255,255,.06)}
    .nav button.active{background:rgba(47,111,237,.18);border-color:rgba(47,111,237,.35);color:#fff}
    .nav small{display:block;color:#8ea2c4;margin-top:4px;font-size:12px;line-height:1.35}
    .sidebar .foot{position:absolute;left:18px;right:18px;bottom:18px;color:#8ea2c4;font-size:12px;line-height:1.5}

    .main{padding:20px;display:grid;grid-template-rows:auto auto 1fr;gap:16px}
    .topbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
    .topbar .title h2{margin:0;font-size:20px}
    .topbar .title p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .select, .search{height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;font-size:14px;outline:none}
    .search{width:min(320px,100%)}
    .btn{height:38px;border:none;border-radius:12px;padding:0 14px;font-size:14px;cursor:pointer;background:#e8eefb;color:#1d4ed8}
    .btn.primary{background:linear-gradient(135deg,var(--brand2),#4f8cff);color:#fff}
    .btn.ghost{background:#fff;border:1px solid var(--line);color:#334155}

    .dashboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .metric{padding:16px;min-height:108px;position:relative;overflow:hidden}
    .metric .label{font-size:13px;color:var(--muted)}
    .metric .value{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-0.02em}
    .metric .delta{margin-top:8px;font-size:12px}
    .metric .spark{position:absolute;right:-18px;bottom:-18px;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(47,111,237,.25), rgba(47,111,237,.05) 55%, transparent 56%)}
    .metric.brand .spark{background:radial-gradient(circle at 30% 30%, rgba(255,107,92,.28), rgba(255,107,92,.06) 55%, transparent 56%)}
    .metric.warn .spark{background:radial-gradient(circle at 30% 30%, rgba(217,119,6,.28), rgba(217,119,6,.06) 55%, transparent 56%)}
    .metric.ok .spark{background:radial-gradient(circle at 30% 30%, rgba(31,157,85,.26), rgba(31,157,85,.06) 55%, transparent 56%)}
    .delta.pos{color:var(--ok)} .delta.neg{color:var(--bad)} .delta.mid{color:var(--warn)}

    .content{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:start}
    .section{padding:16px}
    .section h3{margin:0 0 10px;font-size:16px}
    .section .desc{color:var(--muted);font-size:13px;margin-bottom:12px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .tab{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#334155;font-size:13px;cursor:pointer}
    .tab.active{background:#eaf0ff;border-color:#bfd0ff;color:#1d4ed8;font-weight:700}

    .panel{padding:16px}
    .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .panel-head h3{margin:0;font-size:16px}
    .kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .mini{border:1px solid var(--line);border-radius:14px;padding:12px;background:linear-gradient(180deg,#fff,#fbfdff)}
    .mini .k{font-size:12px;color:var(--muted)}
    .mini .v{font-size:20px;font-weight:800;margin-top:6px}
    .mini .s{font-size:12px;color:var(--muted);margin-top:4px}

    .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:collapse;min-width:720px;background:#fff}
    th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
    th{background:#f8fafc;color:#334155;white-space:nowrap}
    tr:hover td{background:#fafcff}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
    .pill.p0{background:#fee2e2;color:#991b1b}.pill.p1{background:#ffedd5;color:#9a3412}.pill.p2{background:#dbeafe;color:#1e3a8a}

    .list{display:grid;gap:10px}
    .task{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.15s ease;display:grid;gap:6px}
    .task:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(15,23,42,.06)}
    .task .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .task .name{font-weight:700}
    .task .meta{color:var(--muted);font-size:12px}
    .task .tags{display:flex;gap:8px;flex-wrap:wrap}

    .drawer{position:fixed;top:0;right:0;width:min(420px,92vw);height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .22s ease;z-index:20;padding:18px;overflow:auto}
    .drawer.open{transform:translateX(0)}
    .drawer h3{margin:0 0 8px;font-size:18px}.drawer .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
    .drawer .block{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#fbfdff}
    .drawer .block h4{margin:0 0 8px;font-size:13px;color:#334155}.drawer .kv{display:grid;grid-template-columns:88px 1fr;gap:8px;font-size:13px}
    .drawer .close{position:sticky;top:0;float:right;border:none;background:#eef2ff;color:#1d4ed8;border-radius:10px;height:34px;padding:0 12px;cursor:pointer}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.32);opacity:0;pointer-events:none;transition:.2s ease;z-index:10}
    .overlay.on{opacity:1;pointer-events:auto}

    @media (max-width:1120px){.dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.content{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.app{grid-template-columns:1fr}}
    @media (max-width:720px){.main{padding:14px}.dashboard{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr}.search{width:100%}}
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <button class="close" id="closeDrawer">关闭</button>
    <h3 id="dTitle">任务详情</h3>
    <div class="sub" id="dSub">点击任务后查看规则、责任人和处理建议</div>
    <div class="block">
      <h4>基本信息</h4>
      <div class="kv"><div>类型</div><div id="dType"></div><div>优先级</div><div id="dPri"></div><div>负责人</div><div id="dOwner"></div><div>时限</div><div id="dSla"></div></div>
    </div>
    <div class="block">
      <h4>触发规则</h4>
      <div id="dRule"></div>
    </div>
    <div class="block">
      <h4>动作建议</h4>
      <div id="dAction"></div>
    </div>
    <div class="block">
      <h4>业务影响</h4>
      <div id="dImpact"></div>
    </div>
  </aside>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">DB</div>
        <div>
          <h1>业务部驾驶舱</h1>
          <p>经营总览 / 任务中心</p>
        </div>
      </div>
      <div class="nav" id="nav"></div>
      <div class="foot">
        交互原型<br/>共性优先，岗位个性化补充。
      </div>
    </aside>

    <main class="main">
      <header class="topbar card">
        <div class="title">
          <h2 id="pageTitle">共性经营驾驶舱</h2>
          <p id="pageDesc">统一展示 AM / BD / IS / Leader 的核心经营指标和风险任务。</p>
        </div>
        <div class="filters">
          <select class="select" id="roleFilter"></select>
          <select class="select" id="periodFilter">
            <option>今日</option><option selected>本周</option><option>本月</option><option>本季</option>
          </select>
          <input class="search" id="searchInput" placeholder="搜索任务、指标、客户..." />
          <button class="btn primary" id="resetBtn">重置</button>
        </div>
      </header>

      <section class="dashboard" id="metrics"></section>

      <section class="content">
        <div class="card section">
          <div class="panel-head">
            <h3>页面切换</h3>
            <div class="tabs" id="tabs"></div>
          </div>
          <div class="desc" id="sectionDesc"></div>
          <div id="sectionBody"></div>
        </div>

        <div class="card panel">
          <div class="panel-head">
            <h3>任务列表</h3>
            <span class="meta" id="taskCount"></span>
          </div>
          <div class="list" id="taskList"></div>
        </div>
      </section>
    </main>
  </div>

  {title:'公海客户认领后30天无进展', type:'公海管理', pri:'P2', owner:'AM', sla:'30天', rule:'公海认领客户在30天内没有询盘或订单进展。', action:'派发“公海客户激活跟进”任务。', impact:'影响公海召回效率和沉默客户激活。', page:'common'},
  {title:'高价值询盘转化率环比下降>15%', type:'BD 个性化', pri:'P1', owner:'本人+Leader', sla:'当日', rule:'BD 个人维度高价值询盘（$5K+）转化率环比下降超过15%。', action:'发起“大额询盘转化复盘”任务。', impact:'直接影响新客开发质量和高价值订单获取。', page:'BD'},
  {title:'询盘→报价转化率低于均值50%', type:'IS 个性化', pri:'P1', owner:'本人', sla:'当日', rule:'IS 个人转化率低于团队均值50%。', action:'派发“询盘转化能力提升”任务。', impact:'影响首棒转化和整体询盘产能。', page:'IS'},
  {title:'客诉首次响应超时', type:'CS 个性化', pri:'P0', owner:'本人+Leader', sla:'2小时/4小时', rule:'A 类客诉首次响应超过SLA。', action:'发起“响应时效改进”任务。', impact:'影响客户满意度和投诉升级概率。', page:'CS'},
  {title:'BD→AM移交后客户沉默>30天', type:'协同类', pri:'P1', owner:'BD+AM+Leader', sla:'30天', rule:'客户移交后30天内无有效互动或成交。', action:'派发“客户交接断层处理”任务。', impact:'影响交接闭环和客户流失风险。', page:'common'},
  {title:'A类客户>45天未互动', type:'客户维护类', pri:'P0', owner:'AM', sla:'45天', rule:'A类客户超过45天没有互动记录。', action:'发起“核心客户紧急关怀”任务。', impact:'直接影响核心客户稳定和复购机会。', page:'common'},
];

const nav = document.getElementById('nav');
const metricsEl = document.getElementById('metrics');
const tabsEl = document.getElementById('tabs');
const sectionDesc = document.getElementById('sectionDesc');
const sectionBody = document.getElementById('sectionBody');
const taskList = document.getElementById('taskList');
const taskCount = document.getElementById('taskCount');
const pageTitle = document.getElementById('pageTitle');
const pageDesc = document.getElementById('pageDesc');
const roleFilter = document.getElementById('roleFilter');
const searchInput = document.getElementById('searchInput');
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');

const roleOptions = ['全部角色','AM','BD','IS','CS','Leader'];
roleOptions.forEach(r => { const o = document.createElement('option'); o.textContent = r; o.value = r; roleFilter.appendChild(o); });

function renderNav(){
  nav.innerHTML = '';
  Object.entries(pages).forEach(([key, page]) => {
    const b = document.createElement('button');
    b.className = key === state.page ? 'active' : '';
    b.innerHTML = `<strong>${page.title}</strong><small>${page.navDesc}</small>`;
    b.onclick = () => { state.page = key; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
    nav.appendChild(b);
  });
}

function renderMetrics(){
  metricsEl.innerHTML = '';
  const items = pages[state.page].metrics;
  items.forEach((m, i) => {
    const div = document.createElement('div');
    div.className = `card metric ${m.tone}`;
    div.innerHTML = `<div class="label">${m.label}</div><div class="value">${m.value}</div><div class="delta ${m.delta.includes('-') || m.delta.includes('低于') ? 'neg' : m.delta.includes('待' ) ? 'mid' : 'pos'}">${m.delta}</div><div class="spark"></div>`;
    metricsEl.appendChild(div);
  });
}

function renderTabs(){
  tabsEl.innerHTML = '';
  pages[state.page].tabs.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab' + (t === (tabsEl.dataset.active || pages[state.page].tabs[0]) ? ' active' : '');
    b.textContent = t;
    b.onclick = () => { tabsEl.dataset.active = t; renderTabs(); renderSection(t); };
    tabsEl.appendChild(b);
  });
}

function renderSection(tab){
  const active = tab || tabsEl.dataset.active || pages[state.page].tabs[0];
  tabsEl.dataset.active = active;
  renderTabs();
  sectionDesc.textContent = pages[state.page].content[active] || '当前页说明';
  sectionBody.innerHTML = `
    <div class="card" style="padding:14px;border-radius:14px;background:var(--panel2);border:1px dashed var(--line)">
      <div style="font-weight:700;margin-bottom:8px">当前页面重点</div>
      <div style="color:var(--muted);font-size:14px">${pages[state.page].content[active] || ''}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px">
      <div class="mini"><div class="k">本页关注点</div><div class="v">${active}</div><div class="s">可直接作为评审项</div></div>
      <div class="mini"><div class="k">联动任务</div><div class="v">${state.page === 'Tasks' ? '全量' : '自动生成'}</div><div class="s">触发后进入任务中心</div></div>
      <div class="mini"><div class="k">页面目标</div><div class="v">可钻取</div><div class="s">先总览后明细</div></div>
    </div>`;
}

function filterTasks(){
  const q = state.search.trim().toLowerCase();
  let list = taskData.filter(t => (state.role === '全部角色' || t.owner.includes(state.role) || t.page.toLowerCase() === state.role.toLowerCase() || (state.page === 'Tasks')));
  if (state.page !== 'Tasks' && state.page !== 'common') {
    list = list.filter(t => t.page === state.page || t.type.includes(state.page));
  }
  if (state.page === 'common') list = list.filter(t => t.page === 'common' || t.type.includes('经营') || t.type.includes('客户维护') || t.type.includes('新客开发') || t.type.includes('协同'));
  if (q) list = list.filter(t => [t.title,t.type,t.owner,t.rule,t.action,t.impact].join(' ').toLowerCase().includes(q));
  return list;
}

function renderTasks(){
  const list = filterTasks();
  taskCount.textContent = `${list.length} 条`;
  taskList.innerHTML = '';
  if (!list.length) {
    taskList.innerHTML = '<div style="color:var(--muted);padding:12px">没有匹配的任务。</div>';
    return;
  }
  list.forEach(t => {
    const el = document.createElement('div');
    el.className = 'task';
    el.innerHTML = `
      <div class="row"><div class="name">${t.title}</div><span class="pill ${t.pri.toLowerCase()}">${t.pri}</span></div>
      <div class="meta">${t.type} · 负责人：${t.owner} · SLA：${t.sla}</div>
      <div class="tags"><span class="pill ${t.pri.toLowerCase()}">${t.pri}</span><span class="pill">${t.page === 'common' ? '共性' : t.page}</span></div>`;
    el.onclick = () => openDrawer(t);
    taskList.appendChild(el);
  });
}

function openDrawer(t){
  document.getElementById('dTitle').textContent = t.title;
  document.getElementById('dSub').textContent = `${t.type} · ${t.page === 'common' ? '共性' : t.page} · 优先级 ${t.pri}`;
  document.getElementById('dType').textContent = t.type;
  document.getElementById('dPri').innerHTML = `<span class="pill ${t.pri.toLowerCase()}">${t.pri}</span>`;
  document.getElementById('dOwner').textContent = t.owner;
  document.getElementById('dSla').textContent = t.sla;
  document.getElementById('dRule').textContent = t.rule;
  document.getElementById('dAction').textContent = t.action;
  document.getElementById('dImpact').textContent = t.impact;
  drawer.classList.add('open'); overlay.classList.add('on');
}

function renderAll(){
  const page = pages[state.page];
  pageTitle.textContent = page.title;
  pageDesc.textContent = page.desc;
  renderNav();
  renderMetrics();
  renderTabs();
  renderSection();
  renderTasks();
}

roleFilter.onchange = () => { state.role = roleFilter.value; renderTasks(); };
searchInput.oninput = () => { state.search = searchInput.value; renderTasks(); };
document.getElementById('resetBtn').onclick = () => { state.role='全部角色'; roleFilter.value='全部角色'; state.search=''; searchInput.value=''; state.page='common'; tabsEl.dataset.active=''; renderAll(); };
document.getElementById('closeDrawer').onclick = () => { drawer.classList.remove('open'); overlay.classList.remove('on'); };
overlay.onclick = () => { drawer.classList.remove('open'); overlay.classList.remove('on'); };

renderAll();
</script>
</body>
</html>
