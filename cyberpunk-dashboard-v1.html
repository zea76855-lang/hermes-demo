<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Smart Factory Dashboard Background</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #05050a; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #controls { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; gap: 10px; }
        button { background: rgba(0, 255, 255, 0.1); border: 1px solid #0ff; color: #0ff; padding: 8px 16px; cursor: pointer; backdrop-filter: blur(5px); }
        button:hover { background: rgba(0, 255, 255, 0.3); }
        #info { position: absolute; bottom: 20px; left: 20px; color: rgba(0, 255, 255, 0.5); font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="saveImage()">SAVE PNG</button>
        <button onclick="regenerate()">REGENERATE</button>
    </div>
    <div id="info">SMART MANUFACTURING DASHBOARD BG // V1.0 // GEN-PROTOTYPE</div>
    <script>
        let gridLines = [];
        let particles = [];
        let uiElements = [];
        let seed = 42;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            colorMode(HSB, 360, 100, 100, 100);
            initSystem();
        }

        function initSystem() {
            randomSeed(seed);
            noiseSeed(seed);
            particles = [];
            gridLines = [];
            uiElements = [];

            // Generate Grid
            for (let i = 0; i < 20; i++) {
                gridLines.push({
                    x: random(width),
                    y: random(height),
                    len: random(100, 400),
                    speed: random(0.5, 2),
                    v: random() > 0.5
                });
            }

            // Generate Particles
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }

            // Generate UI Elements
            for (let i = 0; i < 5; i++) {
                uiElements.push({
                    x: random(width),
                    y: random(height),
                    type: floor(random(3)),
                    size: random(50, 200),
                    rot: random(TWO_PI)
                });
            }
        }

        function draw() {
            background(240, 80, 5, 100); // Deep dark blue background

            // Subtle Grid
            stroke(180, 80, 20, 30);
            strokeWeight(1);
            for (let x = 0; x < width; x += 50) line(x, 0, x, height);
            for (let y = 0; y < height; y += 50) line(0, y, width, y);

            // Tech Lines
            for (let l of gridLines) {
                stroke(180, 80, 50, 40);
                if (l.v) {
                    line(l.x, l.y, l.x, l.y + l.len);
                    l.y += l.speed;
                    if (l.y > height) l.y = -l.len;
                } else {
                    line(l.x, l.y, l.x + l.len, l.y);
                    l.x += l.speed;
                    if (l.x > width) l.x = -l.len;
                }
            }

            // Particles (Data Flow)
            for (let p of particles) {
                p.update();
                p.display();
            }

            // UI Decoration
            for (let u of uiElements) {
                drawUI(u);
            }

            // Main Vignette
            drawVignette();
            
            // Central HUD Glow
            drawHUD();
        }

        function drawUI(u) {
            push();
            translate(u.x, u.y);
            rotate(u.rot + frameCount * 0.01);
            noFill();
            stroke(180, 80, 60, 20);
            if (u.type === 0) {
                ellipse(0, 0, u.size, u.size);
                arc(0, 0, u.size + 10, u.size + 10, 0, PI);
            } else if (u.type === 1) {
                rect(-u.size/2, -u.size/2, u.size, u.size);
                line(-u.size, 0, u.size, 0);
            } else {
                for(let i=0; i<4; i++) {
                    rotate(HALF_PI);
                    line(u.size/2, 0, u.size/2 + 20, 0);
                }
            }
            pop();
        }

        function drawHUD() {
            push();
            translate(width/2, height/2);
            // Cyan Glow
            noFill();
            stroke(180, 80, 100, 10);
            for(let i=0; i<10; i++) {
                ellipse(0, 0, 400 + i*5, 400 + i*5);
            }
            
            // Magenta Accents
            stroke(300, 80, 100, 50);
            strokeWeight(3);
            arc(0, 0, 450, 450, frameCount*0.02, frameCount*0.02 + QUARTER_PI);
            arc(0, 0, 450, 450, frameCount*0.02 + PI, frameCount*0.02 + PI + QUARTER_PI);
            
            // Crosshair
            stroke(180, 80, 100, 80);
            strokeWeight(1);
            line(-20, 0, 20, 0);
            line(0, -20, 0, 20);
            
            // Circles
            ellipse(0, 0, 380, 380);
            
            // Scanning bar
            let scanY = (frameCount * 2) % 400 - 200;
            stroke(180, 80, 100, 20);
            line(-200, scanY, 200, scanY);
            pop();
        }

        function drawVignette() {
            let gradient = drawingContext.createRadialGradient(
                width/2, height/2, 100,
                width/2, height/2, width*0.8
            );
            gradient.addColorStop(0, 'rgba(5, 5, 10, 0)');
            gradient.addColorStop(1, 'rgba(5, 5, 10, 0.8)');
            drawingContext.fillStyle = gradient;
            rect(0, 0, width, height);
        }

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = random(width);
                this.y = random(height);
                this.vx = random(-1, 1);
                this.vy = random(-1, 1);
                this.size = random(1, 3);
                this.hue = random() > 0.5 ? 180 : 300;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.init();
                }
            }
            display() {
                noStroke();
                fill(this.hue, 80, 100, 50);
                ellipse(this.x, this.y, this.size);
                // Glow
                fill(this.hue, 80, 100, 5);
                ellipse(this.x, this.y, this.size * 4);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function saveImage() {
            saveCanvas('cyberpunk-manufacturing-bg', 'png');
        }

        function regenerate() {
            seed = floor(random(999999));
            initSystem();
        }
    </script>
</body>
</html>
