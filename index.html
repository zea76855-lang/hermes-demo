<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM 客户管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --brand:#1E90FF;--brand-dark:#1872CC;--brand-light:#E8F4FD;
  --bg:#f8f9fc;--card-bg:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--border-light:#f1f5f9;
  --shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow:0 4px 12px rgba(0,0,0,.06);--shadow-lg:0 12px 40px rgba(0,0,0,.08);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;--tran:all .25s ease;
}
body{font-family:"PingFang SC","Microsoft YaHei","SF Pro Display",-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
.top-bar{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.15);}
.top-bar h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;}
.top-bar .badge{font-size:10px;background:var(--brand);padding:2px 8px;border-radius:10px;font-weight:600;}
.lang-switch{display:flex;border-radius:var(--radius-xs);overflow:hidden;border:1px solid rgba(255,255,255,.25);}
.lang-switch button{border:none;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);transition:var(--tran);font-family:inherit;}
.lang-switch button.active{background:var(--brand);color:#fff;}

.hero{background:linear-gradient(135deg,var(--brand),#4f6ef7);color:#fff;padding:48px 24px;text-align:center;}
.hero h2{font-size:28px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px;}
.hero p{font-size:14px;opacity:.85;max-width:500px;margin:0 auto;}

.container{max-width:1100px;margin:0 auto;padding:24px;flex:1;}
.section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin:24px 0 12px;display:flex;align-items:center;gap:6px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border-light);padding:24px;cursor:pointer;transition:var(--tran);text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden;}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--brand);}
.card:hover::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand);}
.card-icon{width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;}
.card-icon.company{background:var(--brand-light);}
.card-icon.contact{background:var(--brand-light);}
.card h3{font-size:16px;font-weight:700;margin-bottom:6px;}
.card p{font-size:12px;color:var(--text2);line-height:1.6;}
.card .meta{display:flex;gap:16px;margin-top:14px;font-size:11px;color:var(--text3);}
.card .meta span{display:flex;align-items:center;gap:4px;}
.card .arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text3);transition:var(--tran);}
.card:hover .arrow{color:var(--brand);transform:translateY(-50%) translateX(4px);}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.stat-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border-light);padding:18px 20px;text-align:center;}
.stat-card .num{font-size:28px;font-weight:800;color:var(--brand);}
.stat-card .lbl{font-size:11px;color:var(--text2);margin-top:4px;}

@media(max-width:768px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .hero h2{font-size:22px;}
}
</style>
</head>
<body>

<header class="top-bar">
  <h1>📋 CRM <span data-i18n="title">客户管理系统</span> <span class="badge">v2.0</span></h1>
  <div class="lang-switch">
    <button id="langZh" class="active" onclick="setLang('zh-CN')">中文</button>
    <button id="langEn" onclick="setLang('en')">EN</button>
  </div>
</header>

<section class="hero">
  <h2 data-i18n="hero_title">客户关系管理，一站掌控</h2>
  <p data-i18n="hero_desc">统一管理公司客户与联系人，全流程追踪从潜在到成交的每个阶段</p>
</section>

<div class="container">
  <!-- Stats -->
  <div class="stats">
    <div class="stat-card"><div class="num">24</div><div class="lbl" data-i18n="stat_companies">公司客户</div></div>
    <div class="stat-card"><div class="num">68</div><div class="lbl" data-i18n="stat_contacts">联系人</div></div>
    <div class="stat-card"><div class="num">12</div><div class="lbl" data-i18n="stat_deals">进行中商机</div></div>
    <div class="stat-card"><div class="num">¥5.2M</div><div class="lbl" data-i18n="stat_revenue">累计成交额</div></div>
  </div>

  <div class="section-title">📂 <span data-i18n="nav_customer">客户管理</span></div>
  <div class="grid">
    <a href="company-list.html" class="card">
      <div class="card-icon company">🏢</div>
      <h3 data-i18n="nav_company">公司列表</h3>
      <p data-i18n="company_desc">管理所有合作公司信息，包括基础资料、状态追踪、产品需求与历史记录</p>
      <div class="meta">
        <span>📊 24 <span data-i18n="records">家</span></span>
        <span>👤 张三、李四</span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a href="contact-list.html" class="card">
      <div class="card-icon contact">👤</div>
      <h3 data-i18n="nav_contact">联系人列表</h3>
      <p data-i18n="contact_desc">管理所有联系人信息，跟踪个人画像、性格特征、需求痛点与联系记录</p>
      <div class="meta">
        <span>📊 68 <span data-i18n="records">人</span></span>
        <span>👤 张三、李四、王五</span>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</div>

<script>
const i18n={
  'zh-CN':{
    title:'客户管理系统',hero_title:'客户关系管理，一站掌控',hero_desc:'统一管理公司客户与联系人，全流程追踪从潜在到成交的每个阶段',
    stat_companies:'公司客户',stat_contacts:'联系人',stat_deals:'进行中商机',stat_revenue:'累计成交额',
    nav_customer:'客户管理',nav_company:'公司列表',nav_contact:'联系人列表',
    company_desc:'管理所有合作公司信息，包括基础资料、状态追踪、产品需求与历史记录',
    contact_desc:'管理所有联系人信息，跟踪个人画像、性格特征、需求痛点与联系记录',
    records:'条',
  },
  'en':{
    title:'Customer Management System',hero_title:'CRM, All in One Place',hero_desc:'Unified management of companies and contacts, tracking every stage from lead to deal',
    stat_companies:'Companies',stat_contacts:'Contacts',stat_deals:'Active Deals',stat_revenue:'Total Revenue',
    nav_customer:'Customer Mgmt',nav_company:'Companies',nav_contact:'Contacts',
    company_desc:'Manage all partner company info — profiles, status tracking, product requirements & history',
    contact_desc:'Manage all contact info — persona, traits, pain points & communication records',
    records:'',
  }
};

let currentLang = localStorage.getItem('crm_lang') || 'zh-CN';
function setLang(lang){
  currentLang=lang;localStorage.setItem('crm_lang',lang);
  document.documentElement.lang=lang;
  document.getElementById('langZh').classList.toggle('active',lang==='zh-CN');
  document.getElementById('langEn').classList.toggle('active',lang==='en');
  const d=i18n[lang];if(!d)return;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(d[k])el.innerHTML=d[k];});
}
setLang(currentLang);
</script>
</body>
</html>
