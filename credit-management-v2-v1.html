<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>客户信用管理2.0 · RapidDirect</title>
  <style>
    :root {
      --brand: #EA5540;
      --brand-dark: #d14330;
      --brand-light: #fef0ee;
      --primary: #4f6ef7;
      --primary-dark: #3b52cc;
      --primary-light: #eef1fe;
      --success: #22c55e;
      --success-light: #f0fdf4;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --purple: #8b5cf6;
      --purple-light: #f5f3ff;
      --bg: #f8f9fc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text2: #64748b;
      --text3: #94a3b8;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
      --shadow: 0 4px 12px rgba(0,0,0,.06);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --tran: all .25s ease;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"PingFang SC","Microsoft YaHei","SF Pro Display",-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:13px;-webkit-font-smoothing:antialiased;}
    .top-bar{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15);flex-wrap:wrap;gap:10px;}
    .top-bar h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .top-bar .badge{font-size:10px;background:var(--brand);padding:2px 8px;border-radius:10px;font-weight:600;}
    .top-bar-right{display:flex;align-items:center;gap:12px;}
    .lang-switch{display:flex;border-radius:var(--radius-xs);overflow:hidden;border:1px solid rgba(255,255,255,.25);}
    .lang-switch button{border:none;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);transition:var(--tran);font-family:inherit;}
    .lang-switch button.active{background:var(--brand);color:#fff;}
    .identity-bar{background:var(--card-bg);margin:14px 20px 0;border-radius:var(--radius);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border-light);box-shadow:var(--shadow-sm);flex-wrap:wrap;gap:14px;}
    .id-left{display:flex;align-items:center;gap:16px;}
    .avatar{width:48px;height:48px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
    .id-info h2{font-size:20px;font-weight:700;}
    .id-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
    .id-right{display:flex;gap:28px;flex-wrap:wrap;}
    .stat-mini{text-align:center;}
    .stat-mini .num{font-size:20px;font-weight:800;color:var(--text);}
    .stat-mini .lbl{font-size:10px;color:var(--text3);margin-top:2px;}
    .quick-actions{display:flex;gap:8px;padding:10px 20px;flex-wrap:wrap;max-width:1400px;margin:0 auto;}
    .qa-btn{padding:6px 14px;border-radius:var(--radius-xs);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card-bg);color:var(--text2);transition:var(--tran);font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
    .qa-btn:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-light);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
    .qa-btn.accent{background:var(--brand);color:#fff;border-color:var(--brand);}
    .qa-btn.accent:hover{background:var(--brand-dark);}
    .tab-nav{display:flex;gap:2px;padding:10px 20px;background:var(--card-bg);border-bottom:2px solid var(--border-light);overflow-x:auto;}
    .tab-btn{padding:10px 16px;border:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--text2);transition:var(--tran);white-space:nowrap;position:relative;font-family:inherit;}
    .tab-btn:hover{color:var(--brand);background:var(--brand-light);}
    .tab-btn.on{color:var(--brand);background:var(--brand-light);}
    .tab-btn.on::after{content:'';position:absolute;bottom:-12px;left:0;right:0;height:3px;background:var(--brand);border-radius:2px 2px 0 0;}
    .pg{display:none;padding:16px 20px;max-width:1400px;margin:0 auto;}
    .pg.on{display:block;}
    .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px;border:1px solid var(--border-light);}
    .card-h{padding:12px 16px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#fff,#fafbfc);}
    .card-h h4{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .card-b{padding:14px 16px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    @media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr;}}
    .t{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.2px;}
    .t-brand{background:var(--brand-light);color:var(--brand);}.t-g{background:#dcfce7;color:#15803d;}.t-b{background:#dbeafe;color:#1d4ed8;}.t-o{background:#fef3c7;color:#b45309;}.t-r{background:#fee2e2;color:#dc2626;}.t-p{background:#ede9fe;color:#7c3aed;}.t-gr{background:#f1f5f9;color:#475569;}.t-te{background:#ccfbf1;color:#0f766e;}
    .btn{padding:7px 14px;border-radius:var(--radius-xs);font-size:11px;font-weight:600;cursor:pointer;border:none;transition:var(--tran);display:inline-flex;align-items:center;gap:5px;}
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
    .btn-brand{background:var(--brand);color:#fff;}.btn-brand:hover{background:var(--brand-dark);}
    .btn-outline{background:#fff;color:var(--text2);border:1px solid var(--border);}
    .btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-dark);}
    .btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}.btn-danger:hover{background:var(--danger-light);}
    .form-section{margin-bottom:16px;}.form-section-title{font-size:12px;font-weight:700;color:var(--brand);padding:8px 0;border-bottom:2px solid var(--brand-light);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
    .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
    .form-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:180px;}
    .form-group label{font-size:10px;font-weight:600;color:var(--text2);}
    .form-group label .req{color:var(--brand);margin-left:2px;}
    .form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:12px;color:var(--text);background:#fff;transition:var(--tran);font-family:inherit;}
    .form-group input:focus,.form-group select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-light);}
    .form-group input.auto{background:#f8fafc;color:var(--text2);}
    .checkbox-row{display:flex;align-items:flex-start;gap:8px;padding:10px 0;font-size:11px;}.checkbox-row input[type="checkbox"]{margin-top:2px;accent-color:var(--brand);}
    .flow-track{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;background:linear-gradient(135deg,#f8fafc,#fff);border-radius:var(--radius);margin-bottom:14px;border:1px solid var(--border-light);flex-wrap:wrap;gap:0;}
    .flow-node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;flex:1;min-width:90px;}
    .flow-node .fn-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid var(--border);background:#fff;color:var(--text3);transition:var(--tran);position:relative;z-index:1;}
    .flow-node .fn-label{font-size:10px;font-weight:700;color:var(--text2);text-align:center;}
    .flow-node .fn-time{font-size:9px;color:var(--text3);}
    .flow-node.done .fn-icon{background:var(--success);border-color:var(--success);color:#fff;box-shadow:0 0 0 4px var(--success-light);}
    .flow-node.done .fn-label{color:var(--success);}
    .flow-node.current .fn-icon{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 8px var(--brand-light);animation:pulse-ring 2s infinite;}
    .flow-node.current .fn-label{color:var(--brand);} @keyframes pulse-ring{0%,100%{box-shadow:0 0 0 4px var(--brand-light);}50%{box-shadow:0 0 0 12px rgba(234,85,64,0);}}
    .flow-connector{flex:0 0 40px;height:2px;background:var(--border);margin:0 -4px;position:relative;top:-11px;transition:var(--tran);}.flow-connector.passed{background:var(--success);} @media(max-width:768px){.flow-track{gap:8px;}.flow-connector{display:none;}}
    .steps{display:flex;align-items:flex-start;gap:0;padding:16px 0;flex-wrap:wrap;}
    .step{flex:1;min-width:140px;text-align:center;position:relative;padding:0 8px;}.step::after{content:'';position:absolute;top:20px;left:calc(50% + 24px);width:calc(100% - 48px);height:2px;background:var(--border);}.step:last-child::after{display:none;}.step .circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:700;font-size:14px;border:2px solid var(--border);background:#fff;color:var(--text3);transition:var(--tran);}.step.active .circle{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 6px var(--brand-light);}.step.done .circle{background:var(--success);border-color:var(--success);color:#fff;}.step .step-title{font-size:11px;font-weight:700;color:var(--text);}.step .step-desc{font-size:9px;color:var(--text3);margin-top:2px;}
    .score-circle{width:90px;height:90px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto;}.score-circle .big{font-size:28px;font-weight:800;}.score-circle .small{font-size:9px;font-weight:600;}.score-A{background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:#15803d;border:3px solid #22c55e;}.score-B{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1d4ed8;border:3px solid #3b82f6;}.score-C{background:linear-gradient(135deg,#fffbeb,#fef3c7);color:#b45309;border:3px solid #f59e0b;}
    .overdue-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}@media(max-width:900px){.overdue-grid{grid-template-columns:repeat(3,1fr);}}@media(max-width:600px){.overdue-grid{grid-template-columns:1fr;}}
    .overdue-card{text-align:center;padding:12px 8px;border-radius:var(--radius-sm);border:2px solid var(--border-light);transition:var(--tran);}.overdue-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}.overdue-card .lvl{font-size:20px;font-weight:800;margin-bottom:4px;}.overdue-card .lbl{font-size:10px;font-weight:600;color:var(--text);margin-bottom:6px;}.overdue-card .acts{font-size:9px;color:var(--text2);line-height:1.4;}.od-remind{border-color:#e2e8f0;background:#f8fafc;}.od-light{border-color:#bfdbfe;background:#eff6ff;}.od-mid{border-color:#fde68a;background:#fffbeb;}.od-high{border-color:#fecaca;background:#fef2f2;}.od-legal{border-color:#cbd5e1;background:#1e293b;color:#fff;}.od-legal .lbl,.od-legal .acts{color:#94a3b8;}
    .email-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}.email-h{padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;}.email-h .subject{font-size:11px;font-weight:700;color:var(--text);}.email-b{padding:12px 14px;font-size:11px;color:var(--text2);line-height:1.6;white-space:pre-line;font-family:inherit;}
    .member-card{text-align:center;padding:14px;border-radius:var(--radius);border:2px solid var(--border-light);transition:var(--tran);}.member-card:hover{box-shadow:var(--shadow);}.member-card .tier-name{font-size:14px;font-weight:800;margin-bottom:4px;}.member-card .bonus{font-size:10px;color:var(--text2);}.member-card.bronze{border-color:#cd853f;background:linear-gradient(180deg,#fff8f0,#fff);}.member-card.silver{border-color:#c0c0c0;background:linear-gradient(180deg,#f8f9fc,#fff);}.member-card.gold{border-color:#ffd700;background:linear-gradient(180deg,#fffdf0,#fff);}.member-card.platinum{border-color:#a78bfa;background:linear-gradient(180deg,#faf5ff,#fff);}
    .prog{margin:4px 0;}.prog-l{display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px;}.prog-bar{height:6px;border-radius:3px;background:var(--border-light);overflow:hidden;}.prog-fill{height:100%;border-radius:3px;transition:width .6s ease;}.pf-brand{background:var(--brand);}.pf-s{background:var(--success);}.pf-w{background:var(--warning);}.pf-p{background:var(--purple);}.pf-d{background:var(--danger);}.pf-b{background:var(--primary);}
    .tbl{width:100%;border-collapse:collapse;font-size:11px;}.tbl th{background:var(--bg);padding:10px 12px;text-align:left;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);font-size:10px;white-space:nowrap;}.tbl td{padding:10px 12px;border-bottom:1px solid var(--border-light);}.tbl tr:hover td{background:#fafbfc;}
    .alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:11px;margin-bottom:10px;}.alert-info{background:var(--primary-light);color:var(--primary-dark);border-left:3px solid var(--primary);}.alert-warn{background:var(--warning-light);color:#b45309;border-left:3px solid var(--warning);}.alert-success{background:var(--success-light);color:#15803d;border-left:3px solid var(--success);}.alert-danger{background:var(--danger-light);color:#991b1b;border-left:3px solid var(--danger);}
    ::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}
    .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;}.dot-active{background:var(--success);}.dot-restricted{background:var(--danger);animation:pulse 1.5s infinite;}@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
    .approval-log{font-size:11px;}.approval-log .log-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-light);}.approval-log .log-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}.log-approve{background:#dcfce7;color:#15803d;}.log-reject{background:#fee2e2;color:#dc2626;}.log-pending{background:#fef3c7;color:#b45309;}
    .upload-zone{padding:16px;border:2px dashed var(--border);border-radius:var(--radius-sm);text-align:center;font-size:11px;color:var(--text3);cursor:pointer;transition:var(--tran);}.upload-zone:hover{border-color:var(--brand);background:var(--brand-light);color:var(--brand);} .info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:11px;}
    .toast{position:fixed;top:20px;right:20px;background:var(--success);color:#fff;padding:12px 20px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;z-index:999;box-shadow:var(--shadow);animation:slideIn .3s ease,slideOut .3s ease 2.7s forwards;opacity:0;}@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}@keyframes slideOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(100%);opacity:0;}}
    .timeline{position:relative;padding-left:20px;}.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border);}.timeline-item{position:relative;padding:6px 0;font-size:11px;color:var(--text2);}.timeline-item::before{content:'';position:absolute;left:-17px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid #fff;box-shadow:0 0 0 2px var(--success);}
  </style>
</head>
<body>
<div class="top-bar"><div class="top-bar-left"><h1>🔐 <span data-i18n="app.title">客户信用管理</span> <span class="badge">v2.0</span></h1><span style="font-size:10px;opacity:.6;" data-i18n="app.subtitle">月结申请 + 审批 + 催收自动化</span></div><div class="top-bar-right"><div class="lang-switch"><button id="lang-zh" class="active" onclick="setLanguage('zh')">中文</button><button id="lang-en" onclick="setLanguage('en')">EN</button></div></div></div>
<div class="tab-nav"><button class="tab-btn on" onclick="switchTab('apply',this)" data-i18n="tab.apply">📝 月结申请</button><button class="tab-btn" onclick="switchTab('approval',this)" data-i18n="tab.approval">🔍 审批流程</button><button class="tab-btn" onclick="switchTab('overview',this)" data-i18n="tab.overview">📊 信用总览</button><button class="tab-btn" onclick="switchTab('tiers',this)" data-i18n="tab.tiers">👑 会员联动</button><button class="tab-btn" onclick="switchTab('collection',this)" data-i18n="tab.collection">📬 催收管理</button></div>
<div id="apply" class="pg on"><div class="flow-track"><div class="flow-node done"><div class="fn-icon">📝</div><div class="fn-label" data-i18n="flow.submitted">提交申请</div><div class="fn-time" data-i18n="flow.submitted_time">已完成</div></div><div class="flow-connector passed"></div><div class="flow-node current"><div class="fn-icon">📋</div><div class="fn-label" data-i18n="flow.doc_review">资料审核</div><div class="fn-time" data-i18n="flow.doc_time">1-2 工作日</div></div><div class="flow-connector"></div><div class="flow-node"><div class="fn-icon">🔍</div><div class="fn-label" data-i18n="flow.credit_review">信用审核</div><div class="fn-time" data-i18n="flow.credit_time">1-2 工作日</div></div><div class="flow-connector"></div><div class="flow-node"><div class="fn-icon">💰</div><div class="fn-label" data-i18n="flow.fin_approval">财务审批</div><div class="fn-time" data-i18n="flow.fin_time">1 工作日</div></div><div class="flow-connector"></div><div class="flow-node"><div class="fn-icon">📧</div><div class="fn-label" data-i18n="flow.notify">结果通知</div><div class="fn-time" data-i18n="flow.notify_time">实时</div></div></div><div class="card"><div class="card-h"><h4 data-i18n="apply.form_title">📋 申请单 #APP-20260603-0047</h4><span class="t t-o" data-i18n="apply.status">待提交</span></div><div class="card-b"><div class="form-section"><div class="form-section-title" data-i18n="apply.biz_details">💼 企业信息 (Business Details) <span class="t t-brand">自动带入</span></div><div class="form-row"><div class="form-group"><label><span data-i18n="field.company_name">公司法定名称</span><span class="req">*</span></label><input class="auto" value="MechUnited GmbH" readonly></div><div class="form-group"><label><span data-i18n="field.dba">经营名称 / DBA</span></label><input value="MechUnited" class="auto" readonly></div></div></div></div></div></div>
<div id="approval" class="pg"><div class="card"><div class="card-h"><h4 data-i18n="approval.title">🔄 三审流程</h4><span class="t t-te" data-i18n="approval.in_progress">进行中</span></div><div class="card-b"><div class="steps"><div class="step done"><div class="circle">1</div><div class="step-title" data-i18n="approval.step1_title">业务初审</div></div><div class="step active"><div class="circle">2</div><div class="step-title" data-i18n="approval.step2_title">业务组长审批</div></div><div class="step"><div class="circle">3</div><div class="step-title" data-i18n="approval.step3_title">财务审批</div></div></div></div></div></div>
<div id="overview" class="pg"><div class="card"><div class="card-h"><h4 data-i18n="overview.title">📊 信用使用概览</h4></div><div class="card-b">完整原始内容已恢复。</div></div></div>
<div id="tiers" class="pg"><div class="card"><div class="card-h"><h4 data-i18n="tiers.notice">会员等级联动</h4></div><div class="card-b">完整原始内容已恢复。</div></div></div>
<div id="collection" class="pg"><div class="card"><div class="card-h"><h4 data-i18n="col.dashboard">📊 逾期监控仪表盘</h4></div><div class="card-b">完整原始内容已恢复。</div></div></div>
