<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>客户信用管理2.0 · RapidDirect</title>
  <style>
    :root {
      --brand: #EA5540;
      --brand-dark: #d14330;
      --brand-light: #fef0ee;
      --primary: #4f6ef7;
      --primary-dark: #3b52cc;
      --primary-light: #eef1fe;
      --success: #22c55e;
      --success-light: #f0fdf4;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --purple: #8b5cf6;
      --purple-light: #f5f3ff;
      --bg: #f8f9fc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text2: #64748b;
      --text3: #94a3b8;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
      --shadow: 0 4px 12px rgba(0,0,0,.06);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --tran: all .25s ease;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:"PingFang SC","Microsoft YaHei","SF Pro Display",-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:13px;-webkit-font-smoothing:antialiased;}
    .top-bar{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15);flex-wrap:wrap;gap:10px;}
    .top-bar h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .top-bar .badge{font-size:10px;background:var(--brand);padding:2px 8px;border-radius:10px;font-weight:600;}
    .top-bar-right{display:flex;align-items:center;gap:12px;}
    .lang-switch{display:flex;border-radius:var(--radius-xs);overflow:hidden;border:1px solid rgba(255,255,255,.25);}
    .lang-switch button{border:none;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);transition:var(--tran);font-family:inherit;}
    .lang-switch button.active{background:var(--brand);color:#fff;}
    .identity-bar{background:var(--card-bg);margin:14px 20px 0;border-radius:var(--radius);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border-light);box-shadow:var(--shadow-sm);flex-wrap:wrap;gap:14px;}
    .id-left{display:flex;align-items:center;gap:16px;}
    .avatar{width:48px;height:48px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
    .id-info h2{font-size:20px;font-weight:700;}
    .id-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
    .id-right{display:flex;gap:28px;flex-wrap:wrap;}
    .stat-mini{text-align:center;}
    .stat-mini .num{font-size:20px;font-weight:800;color:var(--text);}
    .stat-mini .lbl{font-size:10px;color:var(--text3);margin-top:2px;}
    .quick-actions{display:flex;gap:8px;padding:10px 20px;flex-wrap:wrap;max-width:1400px;margin:0 auto;}
    .qa-btn{padding:6px 14px;border-radius:var(--radius-xs);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card-bg);color:var(--text2);transition:var(--tran);font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
    .qa-btn:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-light);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
    .qa-btn.accent{background:var(--brand);color:#fff;border-color:var(--brand);}
    .qa-btn.accent:hover{background:var(--brand-dark);}
    .tab-nav{display:flex;gap:2px;padding:10px 20px;background:var(--card-bg);border-bottom:2px solid var(--border-light);overflow-x:auto;}
    .tab-btn{padding:10px 16px;border:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--text2);transition:var(--tran);white-space:nowrap;position:relative;font-family:inherit;}
    .tab-btn:hover{color:var(--brand);background:var(--brand-light);}
    .tab-btn.on{color:var(--brand);background:var(--brand-light);}
    .tab-btn.on::after{content:'';position:absolute;bottom:-12px;left:0;right:0;height:3px;background:var(--brand);border-radius:2px 2px 0 0;}
    .pg{display:none;padding:16px 20px;max-width:1400px;margin:0 auto;}
    .pg.on{display:block;}
    .card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px;border:1px solid var(--border-light);}
    .card-h{padding:12px 16px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#fff,#fafbfc);}
    .card-h h4{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
    .card-b{padding:14px 16px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    .g-left{display:grid;grid-template-columns:340px 1fr;gap:14px;}
    @media(max-width:1100px){.g-left{grid-template-columns:1fr;}}
    @media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr;}}
    .info-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-light);font-size:12px;}
    .info-row:last-child{border-bottom:none;}
    .info-row .key{color:var(--text2);font-weight:400;min-width:100px;}
    .info-row .val{color:var(--text);font-weight:600;text-align:right;word-break:break-all;}
    .metric-row{display:flex;gap:12px;flex-wrap:wrap;}
    .metric-card{flex:1;min-width:120px;background:var(--bg);border-radius:var(--radius-sm);padding:14px;text-align:center;transition:var(--tran);}
    .metric-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
    .metric-card .m-num{font-size:22px;font-weight:800;color:var(--text);}
    .metric-card .m-unit{font-size:13px;color:var(--text2);font-weight:500;}
    .metric-card .m-lbl{font-size:10px;color:var(--text3);margin-top:3px;}
    .metric-card.accent .m-num{color:var(--brand);}
    .metric-card.success .m-num{color:var(--success);}
    .metric-card.warning .m-num{color:var(--warning);}
    .metric-card.primary .m-num{color:var(--primary);}
    .metric-card.danger .m-num{color:var(--danger);}
    .metric-card.purple .m-num{color:var(--purple);}
    .timeline{position:relative;padding-left:24px;}
    .timeline::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--border);}
    .tl-item{position:relative;padding-bottom:18px;}
    .tl-item:last-child{padding-bottom:0;}
    .tl-dot{position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--border);border:2px solid #fff;box-shadow:0 0 0 2px var(--border);}
    .tl-item.ev-opp .tl-dot{background:var(--brand);box-shadow:0 0 0 2px var(--brand-light);}
    .tl-item.ev-mail .tl-dot{background:var(--purple);box-shadow:0 0 0 2px var(--purple-light);}
    .tl-item.ev-note .tl-dot{background:var(--success);box-shadow:0 0 0 2px var(--success-light);}
    .tl-item.ev-ticket .tl-dot{background:var(--warning);box-shadow:0 0 0 2px var(--warning-light);}
    .tl-item.ev-call .tl-dot{background:var(--primary);box-shadow:0 0 0 2px var(--primary-light);}
    .tl-item.ev-meeting .tl-dot{background:var(--teal);box-shadow:0 0 0 2px var(--teal-light);}
    .tl-time{font-size:10px;color:var(--text3);margin-bottom:2px;}
    .tl-title{font-size:13px;font-weight:700;color:var(--text);}
    .tl-desc{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.4;}
    .tl-meta{display:flex;gap:12px;margin-top:3px;font-size:10px;color:var(--text3);}
    .tbl{width:100%;border-collapse:collapse;font-size:11px;}
    .tbl th{background:var(--bg);padding:10px 12px;text-align:left;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);font-size:10px;}
    .tbl td{padding:10px 12px;border-bottom:1px solid var(--border-light);}
    .tbl tr:hover td{background:#fafbfc;}
    .btn{padding:7px 14px;border-radius:var(--radius-xs);font-size:11px;font-weight:600;cursor:pointer;border:none;transition:var(--tran);display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
    .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
    .btn-brand{background:var(--brand);color:#fff;}.btn-brand:hover{background:var(--brand-dark);}
    .btn-outline{background:#fff;color:var(--text2);border:1px solid var(--border);}
    .btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-dark);}
  </style>
</head>
<body>
<div class="top-bar"><h1>客户信用管理 2.0</h1><div class="top-bar-right"><div class="lang-switch"><button class="active">中文</button><button>EN</button></div><button class="btn btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3);">导出</button></div></div>
<div class="identity-bar"><div class="id-left"><div class="avatar">R</div><div class="id-info"><h2>rapiddirect</h2><div class="id-meta"><span class="t t-g">C00002</span><span class="t t-brand">公司客户</span></div></div></div><div class="id-right"><div class="stat-mini"><div class="num">68</div><div class="lbl">累计成交</div></div><div class="stat-mini"><div class="num">$563,262</div><div class="lbl">累计金额</div></div></div></div>
<div class="tab-nav"><button class="tab-btn on">概览</button><button class="tab-btn">申请</button><button class="tab-btn">审批</button><button class="tab-btn">催收</button></div>
<div class="pg on"><div class="card"><div class="card-h"><h4>信用概览</h4></div><div class="card-b">这里保留原始页面内容。</div></div></div>
</body>
</html>
