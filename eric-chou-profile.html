<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eric Chou — Profile Card</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Helvetica Neue","Arial","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f0f0;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{width:600px;background:#ffffff;border-radius:2px;box-shadow:0 8px 40px rgba(0,0,0,0.08);overflow:hidden;}
.photo-area{width:100%;aspect-ratio:3/4;background:#ffffff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.photo-area img{width:100%;height:100%;object-fit:cover;display:block;}
.info-area{background:#ffffff;padding:28px 30px 32px;}
.name-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.name-row h1{font-size:28px;font-weight:700;color:#2563eb;letter-spacing:-0.3px;line-height:1.1;margin:0;}
.name-row .geo-blocks{display:flex;align-items:center;gap:4px;padding-top:2px;}
.geo-blocks .block{display:inline-block;width:10px;height:10px;border-radius:1px;}
.geo-blocks .block.dark{background:#1e3a8a;}
.geo-blocks .block.light{background:#d1d5db;}
.title-line{font-size:16px;font-weight:600;color:#1f2937;line-height:1.4;margin-top:2px;}
</style>
</head>
<body>
<div class="card">
  <div class="photo-area">
    <img src="https://zea76855-lang.github.io/hermes-demo/eric-portrait.png" alt="Eric Chou Portrait">
  </div>
  <div class="info-area">
    <div class="name-row">
      <h1>Eric Chou</h1>
      <div class="geo-blocks">
        <span class="block dark"></span>
        <span class="block light"></span>
        <span class="block light"></span>
      </div>
    </div>
    <div class="title-line">Platform Operations</div>
  </div>
</div>
</body>
</html>
