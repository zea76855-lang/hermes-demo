<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 客服数据看板 | AI CS Dashboard</title>
<style>
/* === RapidDirect Design Tokens === */
:root {
  --brand: #EA5540; --brand-dark: #d14330; --brand-light: #fef0ee;
  --primary: #4f6ef7; --primary-light: #eef1fe;
  --success: #22c55e; --success-light: #f0fdf4;
  --warning: #f59e0b; --warning-light: #fffbeb;
  --danger: #ef4444; --danger-light: #fef2f2;
  --purple: #8b5cf6; --purple-light: #f5f3ff;
  --teal: #14b8a6; --teal-light: #f0fdfa;
  --bg: #f8f9fc; --card: #fff; --text: #1e293b; --text2: #64748b; --text3: #94a3b8;
  --border: #e2e8f0; --border-light: #f1f5f9;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04); --shadow: 0 4px 12px rgba(0,0,0,.06);
  --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
  --font: "PingFang SC", "Microsoft YaHei", "SF Pro Display", -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
a{color:var(--primary);text-decoration:none}

/* === Top Bar === */
.topbar{
  background:linear-gradient(135deg,#1e293b,#334155);color:#fff;
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{font-size:1.1rem;font-weight:700;white-space:nowrap}
.topbar-logo .coral{color:var(--brand)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  padding:6px 14px;border:1px solid transparent;border-radius:var(--radius-xs);
  font-size:.82rem;cursor:pointer;font-family:var(--font);transition:all .2s;
  white-space:nowrap;font-weight:500;
}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-xs{padding:2px 8px;font-size:.7rem}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-dark)}
.btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn-outline:hover{background:rgba(255,255,255,.1)}
.btn-outline-dark{background:transparent;color:var(--text);border-color:var(--border)}
.btn-outline-dark:hover{background:var(--border-light)}
.btn-ghost{background:transparent;color:#fff;border-color:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#16a34a}
.date-btns{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:var(--radius-xs);padding:3px}
.date-btns .btn{border-radius:4px}
.date-btns .btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* === Main Layout === */
.main{padding:20px;max-width:1400px;margin:0 auto}
.section{margin-bottom:20px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-title{font-size:1rem;font-weight:700;color:var(--text)}
.section-subtitle{font-size:.8rem;color:var(--text2)}

/* === KPI Cards === */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi-card{
  background:var(--card);border-radius:var(--radius);padding:18px 16px;
  box-shadow:var(--shadow-sm);border-left:4px solid var(--primary);
  transition:box-shadow .2s,transform .15s;position:relative;overflow:hidden;
  animation:fadeInUp .5s ease both;
}
.kpi-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.kpi-card:nth-child(1){border-left-color:var(--primary);animation-delay:0s}
.kpi-card:nth-child(2){border-left-color:var(--success);animation-delay:.08s}
.kpi-card:nth-child(3){border-left-color:var(--warning);animation-delay:.16s}
.kpi-card:nth-child(4){border-left-color:var(--purple);animation-delay:.24s}
.kpi-card:nth-child(5){border-left-color:var(--brand);animation-delay:.32s}
.kpi-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kpi-icon{font-size:1.3rem}
.kpi-label{font-size:.78rem;color:var(--text2);font-weight:500}
.kpi-value{font-size:2rem;font-weight:800;color:var(--text);line-height:1.1;margin-bottom:4px}
.kpi-change{font-size:.75rem;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.kpi-change.up{color:var(--success)}
.kpi-change.down{color:var(--danger)}
.kpi-change.neutral{color:var(--text2)}
.kpi-sub{font-size:.72rem;color:var(--text3);margin-top:2px}
.kpi-star{color:#f59e0b;font-size:.9rem}

/* === Charts Row === */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart-card{
  background:var(--card);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow-sm);
}
.chart-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chart-legend{display:flex;gap:14px;font-size:.75rem}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.legend-dot.ai{background:var(--primary)}
.legend-dot.human{background:var(--warning)}
.chart-container{position:relative;width:100%}
.chart-svg{width:100%;height:auto;display:block}
.chart-tooltip{
  position:absolute;background:#1e293b;color:#fff;padding:6px 10px;
  border-radius:var(--radius-xs);font-size:.75rem;pointer-events:none;
  opacity:0;transition:opacity .15s;white-space:nowrap;z-index:10;
}
.chart-tooltip.show{opacity:1}

/* Bar chart */
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{width:80px;text-align:right;font-size:.75rem;color:var(--text2);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:22px;background:var(--border-light);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{
  height:100%;border-radius:4px;transition:width .6s ease;
  display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
  font-size:.7rem;font-weight:600;color:#fff;min-width:0;
}
.bar-fill.c1{background:linear-gradient(90deg,var(--primary),#7c8df8)}
.bar-fill.c2{background:linear-gradient(90deg,var(--success),#4ade80)}
.bar-fill.c3{background:linear-gradient(90deg,var(--purple),#a78bfa)}
.bar-fill.c4{background:linear-gradient(90deg,var(--teal),#2dd4bf)}
.bar-fill.c5{background:linear-gradient(90deg,var(--warning),#fbbf24)}
.bar-fill.c6{background:linear-gradient(90deg,var(--brand),#f07262)}
.bar-fill.c7{background:linear-gradient(90deg,#6366f1,#818cf8)}
.bar-fill.c8{background:linear-gradient(90deg,#0ea5e9,#38bdf8)}

/* === Agent Table === */
.table-wrap{overflow-x:auto;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{
  padding:10px 12px;text-align:left;font-weight:600;color:var(--text2);font-size:.75rem;
  background:var(--border-light);cursor:pointer;user-select:none;white-space:nowrap;
  border-bottom:2px solid var(--border);position:sticky;top:0;
}
th:hover{color:var(--text)}
th .sort-arrow{font-size:.65rem;margin-left:3px;opacity:.4}
th.sorted .sort-arrow{opacity:1;color:var(--brand)}
td{padding:9px 12px;border-bottom:1px solid var(--border-light)}
tr:hover td{background:#fafbfd}
tr:last-child td{border-bottom:none}
.badge{
  display:inline-block;padding:3px 8px;border-radius:10px;font-size:.7rem;font-weight:600;
}
.badge-online{background:var(--success-light);color:var(--success)}
.badge-busy{background:var(--warning-light);color:var(--warning)}
.badge-away{background:var(--danger-light);color:var(--danger)}
.perf-bar{display:inline-block;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.perf-high{background:var(--success)}
.perf-mid{background:var(--warning)}
.perf-low{background:var(--danger)}
.score-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.score-high{background:var(--success)}
.score-mid{background:var(--warning)}
.score-low{background:var(--danger)}
.star-rating{color:#f59e0b;font-size:.8rem}

/* === Missed Questions === */
.missed-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.missed-item{
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  border-bottom:1px solid var(--border-light);gap:12px;flex-wrap:wrap;
}
.missed-item:last-child{border-bottom:none}
.missed-item:hover{background:#fafbfd}
.missed-text{flex:1;font-size:.82rem;color:var(--text);min-width:200px}
.missed-meta{display:flex;align-items:center;gap:16px;flex-shrink:0}
.missed-freq{font-weight:700;color:var(--brand);font-size:.85rem}
.missed-date{font-size:.75rem;color:var(--text3)}

/* === Real-time Monitor === */
.rt-monitor{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:16px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.rt-item{display:flex;align-items:center;gap:8px}
.rt-value{font-size:1.5rem;font-weight:800}
.rt-label{font-size:.72rem;color:var(--text2)}
.rt-dot{
  width:10px;height:10px;border-radius:50%;display:inline-block;
  animation:pulse 2s infinite;
}
.rt-dot.green{background:var(--success)}
.rt-dot.yellow{background:var(--warning)}
.rt-dot.red{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* === Animations === */
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* === Responsive === */
@media(max-width:1200px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .charts-row{grid-template-columns:1fr}
}
@media(max-width:768px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .topbar{flex-direction:column;align-items:flex-start}
  .topbar-right{width:100%;justify-content:flex-start}
  .date-btns{flex-wrap:wrap}
  .kpi-value{font-size:1.5rem}
  .rt-monitor{gap:12px}
  .missed-meta{flex-direction:column;gap:4px;align-items:flex-end}
  .bar-label{width:60px;font-size:.7rem}
}

/* === Print === */
@media print{
  body{background:#fff;font-size:11px}
  .topbar,.btn,.date-btns,.missed-item .btn,.rt-dot{display:none!important}
  .main{padding:0;max-width:100%}
  .kpi-row{grid-template-columns:repeat(5,1fr);gap:6px}
  .kpi-card{padding:10px;border-left-width:3px;box-shadow:none;border:1px solid #ddd}
  .kpi-value{font-size:1.3rem}
  .charts-row{grid-template-columns:1fr 1fr;gap:10px}
  .chart-card{box-shadow:none;border:1px solid #ddd;padding:10px}
  .table-wrap{box-shadow:none;border:1px solid #ddd}
  .missed-list,.rt-monitor{box-shadow:none;border:1px solid #ddd}
  @page{margin:1cm}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--border-light)}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:3px}

/* Toast */
.toast{
  position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;
  padding:10px 20px;border-radius:var(--radius-sm);font-size:.82rem;
  z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<!-- Top Bar -->
<header class="topbar">
  <div class="topbar-left">
    <span class="topbar-logo"><span class="coral">●</span> <span data-i18n="title">📊 数据看板</span></span>
  </div>
  <div class="topbar-right">
    <div class="date-btns" id="dateBtns">
      <button class="btn active" data-range="today" data-i18n="today">今日</button>

      <button class="btn" data-range="month" data-i18n="month">本月</button>

    </div>

</header>

<main class="main">

<!-- Section: KPI Row -->
<section class="section">
  <div class="section-header">
    <h2 class="section-title" data-i18n="kpiTitle">📈 关键指标</h2>
    <span class="section-subtitle" id="kpiDateRange">2026-06-11</span>
  </div>
  <div class="kpi-row" id="kpiRow"></div>
</section>

<!-- Section: Charts -->
<section class="section">
  <div class="charts-row">
    <!-- Conversation Volume Trend -->
    <div class="chart-card">
      <div class="chart-card-header">
        <h3 class="section-title" data-i18n="chartTrend">📉 会话量趋势</h3>
        <div class="chart-legend">
          <span><span class="legend-dot ai"></span><span data-i18n="aiHandled">AI处理</span></span>
          <span><span class="legend-dot human"></span><span data-i18n="humanHandled">人工处理</span></span>

      </div>
      <div class="chart-container" id="trendChart">
        <div class="chart-tooltip" id="trendTooltip"></div>
      </div>
    </div>
    <!-- FAQ Hit Rate -->
    <div class="chart-card">
      <div class="chart-card-header">
        <h3 class="section-title" data-i18n="chartFaq">🎯 FAQ命中率</h3>

  </div>
</section>

<!-- Section: Agent Performance -->
<section class="section">
  <div class="section-header">
    <h2 class="section-title" data-i18n="agentPerf">👥 坐席绩效</h2>

  <div class="table-wrap">
    <table id="agentTable">

        <tr>

          <th data-col="satisfaction" data-i18n="colSatisfaction">满意度 <span class="sort-arrow">▼</span></th>
          <th data-col="online" data-i18n="colOnline">在线时长 <span class="sort-arrow">▼</span></th>

</section>

<!-- Section: Missed Questions -->
<section class="section">
  <div class="section-header">
    <h2 class="section-title" data-i18n="missedTitle">❓ 高频未命中问题</h2>
    <button class="btn btn-outline-dark btn-sm" id="btnSortMissed" data-i18n="sortByFreq">按频率排序 ↓</button>
  </div>
  <div class="missed-list" id="missedList"></div>
</section>

<!-- Section: Real-time Monitor -->
<section class="section">
  <div class="section-header">
    <h2 class="section-title" data-i18n="rtTitle">🟢 实时监控</h2>
    <span class="section-subtitle" data-i18n="autoRefresh">每5秒自动刷新</span>
  </div>
  <div class="rt-monitor" id="rtMonitor"></div>

</main>

<div class="toast" id="toast"></div>

<script>
// ===== i18n System =====
const i18n = {
  zh: {
    title:'📊 数据看板',today:'今日',week:'本周',month:'本月',custom:'自定义',
    refresh:'🔄 刷新',export:'📥 导出',lang:'EN',back:'← 返回',
    kpiTitle:'📈 关键指标',kpiTodayInquiries:'今日咨询总量',kpiAiRate:'AI 解决率',
    kpiTransferRate:'转人工率',kpiAvgResponse:'平均响应时间',kpiSatisfaction:'客户满意度',
    vsYesterday:'较昨日',targetLine:'目标线',warningHigh:'偏高',
    seconds:'秒',items:'条',people:'人',stars:'星',
    chartTrend:'📉 会话量趋势',chartFaq:'🎯 FAQ命中率',byCategory:'按分类',
    aiHandled:'AI处理',humanHandled:'人工处理',
    agentPerf:'👥 坐席绩效',colName:'坐席姓名',colGroup:'技能组',colStatus:'状态',
    colHandled:'今日处理',colAdoption:'AI采纳率',colResponse:'平均响应',colSatisfaction:'满意度',
    colOnline:'在线时长',hours:'小时',mins:'分钟',
    missedTitle:'❓ 高频未命中问题',sortByFreq:'按频率排序 ↓',
    addToKB:'补录到知识库',added:'已添加',
    rtTitle:'🟢 实时监控',autoRefresh:'每5秒自动刷新',
    rtConversations:'当前会话',rtAgents:'在线坐席',rtQueue:'排队人数',
    rtHealth:'系统状态',rtOnline:'正常运行',
    exportCSV:'导出CSV',exportDone:'数据已导出',
    copied:'已复制',confirmAdd:'确定补录该问题到知识库？',
    allCategories:'全部分类',noData:'暂无数据',
    online:'在线',busy:'忙碌',away:'离开',
    cncMachining:'CNC加工',injectionMolding:'注塑成型',printing3d:'3D打印',
    sheetMetal:'钣金',surfaceTreatment:'表面处理',quoting:'报价',
    logistics:'物流',materials:'材料',
    statusOnline:'在线',statusBusy:'忙碌',statusAway:'离开',
  },
  en: {

    refresh:'🔄 Refresh',export:'📥 Export',lang:'中文',back:'← Back',
    kpiTitle:'📈 Key Metrics',kpiTodayInquiries:'Total Inquiries Today',kpiAiRate:'AI Resolution Rate',
    kpiTransferRate:'Transfer to Human',kpiAvgResponse:'Avg Response Time',kpiSatisfaction:'Customer Satisfaction',
    vsYesterday:'vs Yesterday',targetLine:'Target',warningHigh:'High',
    seconds:'s',items:'items',people:'ppl',stars:'stars',
    chartTrend:'📉 Conversation Volume',chartFaq:'🎯 FAQ Hit Rate',byCategory:'By Category',
    aiHandled:'AI Handled',humanHandled:'Human Handled',
    agentPerf:'👥 Agent Performance',colName:'Agent Name',colGroup:'Skill Group',colStatus:'Status',
    colHandled:'Handled Today',colAdoption:'AI Adoption',colResponse:'Avg Response',colSatisfaction:'Satisfaction',
    colOnline:'Online Time',hours:'h',mins:'m',
    missedTitle:'❓ Top Missed Questions',sortByFreq:'Sort by Frequency ↓',
    addToKB:'Add to KB',added:'Added',
    rtTitle:'🟢 Real-time Monitor',autoRefresh:'Auto-refresh every 5s',
    rtConversations:'Live Sessions',rtAgents:'Active Agents',rtQueue:'Queue Length',
    rtHealth:'System Health',rtOnline:'Operational',
    exportCSV:'Export CSV',exportDone:'Data Exported',
    copied:'Copied',confirmAdd:'Add this question to knowledge base?',
    allCategories:'All Categories',noData:'No Data',
    online:'Online',busy:'Busy',away:'Away',
    cncMachining:'CNC Machining',injectionMolding:'Injection Molding',printing3d:'3D Printing',
    sheetMetal:'Sheet Metal',surfaceTreatment:'Surface Treatment',quoting:'Quoting',
    logistics:'Logistics',materials:'Materials',
    statusOnline:'Online',statusBusy:'Busy',statusAway:'Away',
  }
};

let lang='zh';
function t(key){return (i18n[lang]&&i18n[lang][key])||key}
function setLang(l){
  lang=l;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(k)el.textContent=t(k);
  });
  renderAll();
  document.getElementById('btnLang').textContent=lang==='zh'?'EN':'中文';
}

// ===== Toast =====
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ===== Simulated Data =====
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function randomFloat(min,max,d=1){return parseFloat((Math.random()*(max-min)+min).toFixed(d))}

const categories=['cncMachining','injectionMolding','printing3d','sheetMetal','surfaceTreatment','quoting','logistics','materials'];

const agents=[
  {name:'张伟',nameEn:'Zhang Wei',group:'cncMachining',status:'online',baseHandled:58,adoption:92,response:22,satisfaction:4.8,onlineHours:7.5},

// ===== Date Range Data =====
function getDateLabels(range){
  const now=new Date();
  const labels=[];
  if(range==='today'){
    for(let i=8;i<=20;i+=2)labels.push(`${i}:00`);
  }else if(range==='week'){
    const days=['周日','周一','周二','周三','周四','周五','周六'];
    for(let i=6;i>=0;i--){
      const d=new Date(now);d.setDate(d.getDate()-i);
      labels.push(`${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}`);
    }
  }else{
    for(let i=29;i>=0;i-=3){
      const d=new Date(now);d.setDate(d.getDate()-i);
      labels.push(`${d.getMonth()+1}/${d.getDate()}`);
    }
  }
  return labels;
}

function getTrendData(range){
  const labels=getDateLabels(range);
  const n=labels.length;
  const ai=[],human=[];
  const baseAi=range==='today'?45:range==='week'?280:1200;
  const baseHuman=range==='today'?18:range==='week'?110:480;
  for(let i=0;i<n;i++){
    ai.push(baseAi+randomInt(-Math.floor(baseAi*0.2),Math.floor(baseAi*0.15)));
    human.push(baseHuman+randomInt(-Math.floor(baseHuman*0.25),Math.floor(baseHuman*0.2)));
  }
  // Ensure smooth-ish trend
  for(let i=1;i<n;i++){
    ai[i]=Math.round(ai[i]*0.4+ai[i-1]*0.6);
    human[i]=Math.round(human[i]*0.4+human[i-1]*0.6);
  }
  return{labels,ai,human};
}

function getKpiData(range){
  const base={
    today:{inquiries:1847,aiRate:78.5,transferRate:21.5,avgResponse:8.2,satisfaction:4.5},
    week:{inquiries:12450,aiRate:76.8,transferRate:23.2,avgResponse:9.1,satisfaction:4.4},
    month:{inquiries:52300,aiRate:75.2,transferRate:24.8,avgResponse:9.8,satisfaction:4.3},
  };
  const d=base[range]||base.today;
  return{
    inquiries:d.inquiries+randomInt(-Math.floor(d.inquiries*0.03),Math.floor(d.inquiries*0.03)),
    aiRate:parseFloat((d.aiRate+randomFloat(-2,2)).toFixed(1)),
    transferRate:parseFloat((100-(d.aiRate+randomFloat(-2,2))).toFixed(1)),
    avgResponse:parseFloat((d.avgResponse+randomFloat(-0.5,0.5)).toFixed(1)),
    satisfaction:parseFloat((d.satisfaction+randomFloat(-0.1,0.1,2)).toFixed(2)),
    prevInquiries:Math.round(d.inquiries*(1+randomFloat(-0.08,0.08))),
  };
}

// ===== Render Trend Chart (SVG) =====
function renderTrendChart(){
  const {labels,ai,human}=getTrendData(currentRange);
  const all=ai.concat(human);
  const maxVal=Math.max(...all);
  const minVal=Math.min(...all);
  const padding={top:20,right:30,bottom:40,left:50};
  const width=700,height=280;
  const chartW=width-padding.left-padding.right;
  const chartH=height-padding.top-padding.bottom;

  const yRange=maxVal-minVal||1;
  const scaleY=v=>padding.top+chartH-((v-minVal)/yRange)*chartH;
  const scaleX=i=>padding.left+(i/(labels.length-1))*chartW;

  // Grid lines
  let gridLines='';
  for(let i=0;i<=4;i++){
    const y=padding.top+(chartH/4)*i;
    const val=Math.round(maxVal-(yRange/4)*i);
    gridLines+=`<line x1="${padding.left}" y1="${y}" x2="${width-padding.right}" y2="${y}" stroke="var(--border-light)" stroke-width="1"/>`;
    gridLines+=`<text x="${padding.left-8}" y="${y+4}" text-anchor="end" fill="var(--text3)" font-size="10">${val}</text>`;
  }

  // Build polyline points
  const aiPoints=ai.map((v,i)=>`${scaleX(i)},${scaleY(v)}`).join(' ');
  const humanPoints=human.map((v,i)=>`${scaleX(i)},${scaleY(v)}`).join(' ');

  // Hover areas
  let hoverRects='';
  const barW=chartW/labels.length*0.6;
  for(let i=0;i<labels.length;i++){
    const cx=scaleX(i);
    hoverRects+=`<rect x="${cx-barW/2}" y="${padding.top}" width="${barW}" height="${chartH}" fill="transparent" data-idx="${i}" class="hover-zone"/>`;
  }

  // X labels
  let xLabels='';
  labels.forEach((l,i)=>{
    xLabels+=`<text x="${scaleX(i)}" y="${height-8}" text-anchor="middle" fill="var(--text2)" font-size="10">${l}</text>`;
  });

  // Dots
  let aiDots='',humanDots='';
  ai.forEach((v,i)=>{
    aiDots+=`<circle cx="${scaleX(i)}" cy="${scaleY(v)}" r="4" fill="var(--primary)" stroke="#fff" stroke-width="2" data-idx="${i}" data-type="ai" class="data-dot"/>`;
  });
  human.forEach((v,i)=>{
    humanDots+=`<circle cx="${scaleX(i)}" cy="${scaleY(v)}" r="4" fill="var(--warning)" stroke="#fff" stroke-width="2" data-idx="${i}" data-type="human" class="data-dot"/>`;
  });

  const svg=`
    <svg viewBox="0 0 ${width} ${height}" class="chart-svg">
      ${gridLines}
      <polyline points="${aiPoints}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
      <polyline points="${humanPoints}" fill="none" stroke="var(--warning)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6,3"/>
      ${hoverRects}
      ${aiDots}
      ${humanDots}
      ${xLabels}
    </svg>`;

  const container=document.getElementById('trendChart');
  // Keep tooltip
  const tooltip=container.querySelector('.chart-tooltip');
  container.innerHTML=svg;
  container.appendChild(tooltip);

  // Hover events
  const tooltipEl=document.getElementById('trendTooltip');
  container.querySelectorAll('.hover-zone').forEach(rect=>{
    rect.addEventListener('mouseenter',function(){
      const idx=parseInt(this.getAttribute('data-idx'));
      const rectBox=container.getBoundingClientRect();
      const svgBox=container.querySelector('svg').getBoundingClientRect();
      const scaleX_f=svgBox.width/width;
      const x=rectBox.left+(scaleX(idx))*scaleX_f;
      const y=rectBox.top+padding.top*scaleX_f;
      tooltipEl.innerHTML=`<b>${labels[idx]}</b><br>${t('aiHandled')}: ${ai[idx]}<br>${t('humanHandled')}: ${human[idx]}`;
      tooltipEl.style.left=(x-rectBox.left)+'px';
      tooltipEl.style.top=(y-rectBox.top-40)+'px';
      tooltipEl.classList.add('show');
    });
    rect.addEventListener('mouseleave',()=>tooltipEl.classList.remove('show'));
  });
}

// ===== Render Agent Table =====
let agentSortCol='name';
let agentSortDir='asc';

function renderAgentTable(){
  const sorted=[...agents].sort((a,b)=>{
    let va,vb;
    switch(agentSortCol){
      case 'name':va=a.name;vb=b.name;break;
      case 'group':va=t(a.group);vb=t(b.group);break;
      case 'status':va=a.status;vb=b.status;break;
      case 'handled':va=a.baseHandled;vb=b.baseHandled;break;
      case 'adoption':va=a.adoption;vb=a.adoption;break;
      case 'response':va=a.response;vb=a.response;break;
      case 'satisfaction':va=a.satisfaction;vb=a.satisfaction;break;
      case 'online':va=a.onlineHours;vb=b.onlineHours;break;
      default:va=a.name;vb=b.name;
    }
    if(typeof va==='string')return agentSortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    return agentSortDir==='asc'?va-vb:vb-va;
  });

  const body=document.getElementById('agentBody');
  body.innerHTML=sorted.map(a=>{
    const handled=a.baseHandled+randomInt(-5,5);
    const perfClass=a.adoption>=85?'perf-high':a.adoption>=70?'perf-mid':'perf-low';
    const perfWidth=Math.min(100,a.adoption);
    const scoreClass=a.satisfaction>=4.5?'score-high':a.satisfaction>=4?'score-mid':'score-low';
    const statusKey=a.status==='online'?'statusOnline':a.status==='busy'?'statusBusy':'statusAway';
    const badgeClass=a.status==='online'?'badge-online':a.status==='busy'?'badge-busy':'badge-away';
    const hours=Math.floor(a.onlineHours);
    const mins=Math.round((a.onlineHours-hours)*60);
    return `
      <tr>
        <td><strong>${lang==='zh'?a.name:a.nameEn}</strong></td>
        <td>${t(a.group)}</td>
        <td><span class="badge ${badgeClass}">${t(statusKey)}</span></td>
        <td>${handled}</td>
        <td>
          <span class="perf-bar ${perfClass}" style="width:${perfWidth*0.5}px"></span>
          ${a.adoption}%
        </td>
        <td>${a.response}${t('seconds')}</td>
        <td>
          <span class="score-dot ${scoreClass}"></span>
          <span class="star-rating">${'★'.repeat(Math.round(a.satisfaction))}${'☆'.repeat(5-Math.round(a.satisfaction))}</span>
          ${a.satisfaction}
        </td>
        <td>${hours}${t('hours')}${mins}${t('mins')}</td>
      </tr>`;
  }).join('');

  // Update header arrows
  document.querySelectorAll('#agentTable th').forEach(th=>{
    const col=th.getAttribute('data-col');
    th.classList.toggle('sorted',col===agentSortCol);
    const arrow=th.querySelector('.sort-arrow');
    if(arrow)arrow.textContent=col===agentSortCol?(agentSortDir==='asc'?'▲':'▼'):'▼';
  });
}

// ===== Export CSV =====
function exportCSV(){
  let csv='\uFEFF';
  csv+=`${t('colName')},${t('colGroup')},${t('colStatus')},${t('colHandled')},${t('colAdoption')},${t('colResponse')},${t('colSatisfaction')},${t('colOnline')}\n`;
  agents.forEach(a=>{
    const statusKey=a.status==='online'?'statusOnline':a.status==='busy'?'statusBusy':'statusAway';
    csv+=`"${lang==='zh'?a.name:a.nameEn}","${t(a.group)}","${t(statusKey)}",${a.baseHandled+randomInt(-3,5)},${a.adoption}%,${a.response}${t('seconds')},${a.satisfaction},${Math.floor(a.onlineHours)}${t('hours')}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='agent-performance.csv';a.click();
  URL.revokeObjectURL(url);
  toast(`✅ ${t('exportDone')}`);
}
