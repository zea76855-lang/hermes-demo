<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>联系人列表 · CRM 客户管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --brand:#1E90FF;--brand-dark:#1872CC;--brand-light:#E8F4FD;
  --primary:#4f6ef7;--primary-dark:#3b52cc;--primary-light:#eef1fe;
  --success:#22c55e;--success-light:#f0fdf4;
  --warning:#f59e0b;--warning-light:#fffbeb;
  --danger:#ef4444;--danger-light:#fef2f2;
  --bg:#f8f9fc;--card-bg:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
  --border:#e2e8f0;--border-light:#f1f5f9;
  --shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow:0 4px 12px rgba(0,0,0,.06);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;--tran:all .25s ease;
  --sidebar-w:240px;
}
body{font-family:"PingFang SC","Microsoft YaHei","SF Pro Display",-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:13px;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#1e293b,#0f172a);color:#fff;position:fixed;left:0;top:0;bottom:0;z-index:200;display:flex;flex-direction:column;overflow-y:auto;}
.sidebar-logo{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.sidebar-logo .logo-icon{width:32px;height:32px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;}
.sidebar-logo span{font-size:15px;font-weight:700;letter-spacing:-.3px;}
.sidebar-nav{flex:1;padding:12px 0;}
.nav-section{padding:0 16px;margin-bottom:4px;}
.nav-section-title{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em;padding:8px 4px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--tran);font-size:13px;font-weight:500;color:rgba(255,255,255,.6);text-decoration:none;margin:2px 8px;}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9);}
.nav-item.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(30,144,255,.3);}
.nav-item .nav-badge{font-size:10px;background:rgba(255,255,255,.15);padding:1px 8px;border-radius:10px;margin-left:auto;}
.nav-item.active .nav-badge{background:rgba(255,255,255,.25);}
.nav-sub{padding-left:12px;}

/* Main */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.top-bar{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15);}
.top-bar h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.top-bar .badge{font-size:10px;background:var(--brand);padding:2px 8px;border-radius:10px;font-weight:600;}
.top-bar-right{display:flex;align-items:center;gap:12px;}
.lang-switch{display:flex;border-radius:var(--radius-xs);overflow:hidden;border:1px solid rgba(255,255,255,.25);}
.lang-switch button{border:none;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:rgba(255,255,255,.6);transition:var(--tran);font-family:inherit;}
.lang-switch button.active{background:var(--brand);color:#fff;}

/* Content */
.content{padding:16px 20px;max-width:1400px;width:100%;}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.page-header h2{font-size:18px;font-weight:700;}
.page-header-right{display:flex;gap:8px;}

/* Cards */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:14px;border:1px solid var(--border-light);}
.card-h{padding:12px 16px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#fff,#fafbfc);}
.card-h h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-b{padding:0;overflow-x:auto;}

/* Table */
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:#f8fafc;padding:10px 12px;text-align:left;font-weight:700;color:var(--text2);font-size:11px;border-bottom:2px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;}
thead th:first-child{padding-left:16px;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border-light);vertical-align:middle;}
tbody td:first-child{padding-left:16px;}
tbody tr:hover{background:var(--brand-light);}
tbody tr:last-child td{border-bottom:none;}

/* Tags */
.t{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.2px;}
.t-brand{background:var(--brand-light);color:var(--brand);}
.t-g{background:var(--success-light);color:#15803d;}
.t-b{background:#dbeafe;color:#1d4ed8;}
.t-o{background:var(--warning-light);color:#b45309;}
.t-r{background:var(--danger-light);color:#dc2626;}
.t-p{background:#ede9fe;color:#7c3aed;}
.t-gr{background:#f1f5f9;color:#475569;}

/* Buttons */
.btn{padding:7px 14px;border-radius:var(--radius-xs);font-size:11px;font-weight:600;cursor:pointer;border:none;transition:var(--tran);display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.btn-brand{background:var(--brand);color:#fff;}
.btn-brand:hover{background:var(--brand-dark);}
.btn-outline{background:#fff;color:var(--text2);border:1px solid var(--border);}
.btn-outline:hover{border-color:var(--brand);color:var(--brand);}
.btn-sm{padding:5px 10px;font-size:10px;}

/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.search-bar input,.search-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:12px;color:var(--text);background:#fff;transition:var(--tran);font-family:inherit;min-width:140px;}
.search-bar input:focus,.search-bar select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-light);}
.search-bar input{flex:1;}

/* Pagination */
.pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:11px;color:var(--text2);}
.pagination .pages{display:flex;gap:4px;}
.pagination button{padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-xs);background:#fff;cursor:pointer;font-size:11px;transition:var(--tran);}
.pagination button:hover{border-color:var(--brand);color:var(--brand);}
.pagination button.active{background:var(--brand);color:#fff;border-color:var(--brand);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;display:none;align-items:flex-start;justify-content:center;padding-top:40px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card-bg);border-radius:var(--radius);width:720px;max-width:calc(100vw - 40px);max-height:calc(100vh - 80px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card-bg);z-index:1;border-radius:var(--radius) var(--radius) 0 0;}
.modal-header h3{font-size:16px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--border-light);cursor:pointer;font-size:18px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:var(--tran);}
.modal-close:hover{background:var(--danger-light);color:var(--danger);}
.modal-body{padding:20px;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px;}

/* Form */
.form-section{margin-bottom:16px;}
.form-section-title{font-size:12px;font-weight:700;color:var(--brand);padding:8px 0;border-bottom:2px solid var(--brand-light);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:3px;flex:1;min-width:180px;}
.form-group label{font-size:10px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:2px;}
.form-group label .req{color:var(--danger);}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:12px;color:var(--text);background:#fff;transition:var(--tran);font-family:inherit;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-light);}
.form-group input.auto,.form-group input.synced,.form-group select.auto{background:#f8fafc;color:var(--text2);cursor:not-allowed;}
.form-group textarea{resize:vertical;min-height:60px;}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;}
.checkbox-row input[type="checkbox"]{accent-color:var(--brand);width:16px;height:16px;}
.auto-label{font-size:9px;color:var(--text3);font-style:italic;margin-left:4px;}
.auto-label.synced{color:var(--primary);}

@media(max-width:900px){
  .sidebar{width:60px;}
  .sidebar-logo span,.nav-section-title,.nav-item span{display:none;}
  .sidebar-logo{justify-content:center;padding:12px;}
  .nav-item{justify-content:center;padding:10px;margin:2px 4px;}
  :root{--sidebar-w:60px;}
  .form-row{flex-direction:column;}
  .modal{width:calc(100vw - 20px);}
}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">C</div>
    <span data-i18n="brand">CRM 系统</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">
      <div class="nav-section-title" data-i18n="nav_customer">客户管理</div>
      <a href="company-list.html" class="nav-item">
        <span>🏢</span> <span data-i18n="nav_company">公司列表</span>
        <span class="nav-badge">24</span>
      </a>
      <a href="contact-list.html" class="nav-item active">
        <span>👤</span> <span data-i18n="nav_contact">联系人列表</span>
        <span class="nav-badge">68</span>
      </a>
    </div>
  </nav>
</aside>

<!-- Main -->
<div class="main">
  <header class="top-bar">
    <div class="top-bar-left">
      <h1>📋 <span data-i18n="page_title">客户管理</span> <span class="badge">CRM</span></h1>
    </div>
    <div class="top-bar-right">
      <div class="lang-switch">
        <button id="langZh" class="active" onclick="setLang('zh-CN')">中文</button>
        <button id="langEn" onclick="setLang('en')">EN</button>
      </div>
      <span style="font-size:12px;opacity:.7;">👤 Admin</span>
    </div>
  </header>

  <div class="content">
    <div class="page-header">
      <h2 data-i18n="contact_list_title">联系人列表</h2>
      <div class="page-header-right">
        <button class="btn btn-brand" onclick="openAddModal()">+ <span data-i18n="add_contact">新建联系人</span></button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <input type="text" data-i18n-placeholder="search_contact" placeholder="搜索联系人姓名、公司或邮箱...">
      <select><option value="" data-i18n="filter_stage_all">全部阶段</option><option>潜在客户</option><option>意向确认</option><option>报价阶段</option><option>谈判阶段</option><option>已成交</option></select>
      <select><option value="" data-i18n="filter_country_all">全部国家</option><option>中国</option><option>美国</option><option>德国</option><option>日本</option><option>韩国</option></select>
      <button class="btn btn-outline" data-i18n="search">搜索</button>
    </div>

    <!-- Table Card -->
    <div class="card">
      <div class="card-b">
        <table>
          <thead>
            <tr>
              <th data-i18n="col_name_full">姓名</th>
              <th data-i18n="col_company_rel">所属公司</th>
              <th data-i18n="col_position">职位</th>
              <th data-i18n="col_email">邮箱</th>
              <th data-i18n="col_phone">电话</th>
              <th data-i18n="col_stage">客户阶段</th>
              <th data-i18n="col_owner">跟进人</th>
              <th data-i18n="col_date">创建日期</th>
              <th data-i18n="col_actions">操作</th>
            </tr>
          </thead>
          <tbody id="contactTableBody">
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span><span data-i18n="showing">显示</span> 1-10 / 68 <span data-i18n="records">条</span></span>
        <div class="pages">
          <button class="active">1</button><button>2</button><button>3</button><button>4</button><button>5</button>
          <button data-i18n="next">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Contact Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3 data-i18n="modal_add_contact_title">新建联系人</h3>
      <button class="modal-close" onclick="closeModal('addModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-section">
        <div class="form-section-title">📋 <span data-i18n="sec_basic">基础信息</span></div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_contact_name">联系人姓名</span><span class="req">*</span></label><input type="text"></div>
          <div class="form-group"><label><span data-i18n="f_position">职位/部门</span><span class="req">*</span></label><input type="text"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_email">邮箱</span><span class="req">*</span></label><input type="email" placeholder="contact@example.com"></div>
          <div class="form-group"><label><span data-i18n="f_phone">电话</span><span class="req">*</span></label><input type="tel"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_country">国家/地区</span><span class="req">*</span></label><select><option>中国</option><option>美国</option><option>德国</option><option>日本</option><option>韩国</option><option>其他</option></select></div>
          <div class="form-group"><label><span data-i18n="f_industry">行业</span><span class="req">*</span></label><select><option>电子制造</option><option>汽车零部件</option><option>医疗器械</option><option>消费电子</option><option>工业设备</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_source">客户来源</span><span class="req">*</span></label><select><option>官网询盘</option><option>展会</option><option>平台引流</option><option>老客户推荐</option><option>主动开发</option></select></div>
          <div class="form-group"><label><span data-i18n="f_stage">客户阶段</span><span class="req">*</span></label><select><option>潜在客户</option><option>意向确认</option><option>报价阶段</option><option>谈判阶段</option><option>已成交</option></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_owner">跟进人</span><span class="auto-label">系统自带</span></label><input class="auto" value="张三" disabled></div>
          <div class="form-group"><label><span data-i18n="f_create_date">创建日期</span><span class="auto-label">系统自带</span></label><input class="auto" value="2026-06-16" disabled></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('addModal')" data-i18n="cancel">取消</button>
      <button class="btn btn-brand" onclick="submitAdd()" data-i18n="confirm_add">确认新建</button>
    </div>
  </div>
</div>

<!-- Edit Contact Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal" style="width:760px;">
    <div class="modal-header">
      <h3 data-i18n="modal_edit_contact_title">编辑联系人</h3>
      <button class="modal-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="modal-body">
      <!-- 基础信息 -->
      <div class="form-section">
        <div class="form-section-title"><span class="sec-icon">📋</span> <span data-i18n="sec_basic">基础信息</span></div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_owner">跟进人</span><span class="auto-label">系统自带</span></label><input class="auto" value="张三" disabled></div>
          <div class="form-group"><label><span data-i18n="f_industry_type">行业类型</span><span class="auto-label">系统自带</span></label><input class="auto" value="电子制造" disabled></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_country">国家/地区</span><span class="auto-label">系统自带</span></label><input class="auto" value="中国" disabled></div>
          <div class="form-group"><label><span data-i18n="f_contact_first">联系人姓氏</span><span class="auto-label">系统自带</span></label><input class="auto" value="李" disabled></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_contact_name">联系人名字</span><span class="auto-label">系统自带</span></label><input class="auto" value="明辉" disabled></div>
          <div class="form-group"><label><span data-i18n="f_email">联系人邮箱</span><span class="auto-label">系统自带</span></label><input class="auto" value="liminghui@huaqiang-elec.com" disabled></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_phone">联系人电话</span><span class="auto-label">系统自带</span></label><input class="auto" value="+86 138-8888-1234" disabled></div>
          <div class="form-group"><label><span data-i18n="f_position">职位</span><span class="auto-label">系统自带</span></label><input class="auto" value="采购总监" disabled></div>
        </div>
      </div>

      <!-- 状态信息 -->
      <div class="form-section">
        <div class="form-section-title"><span class="sec-icon">📊</span> <span data-i18n="sec_status">状态信息</span></div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_stage">客户阶段</span><span class="auto-label">系统自带</span></label><input class="auto" value="报价阶段" disabled></div>
          <div class="form-group"><label><span data-i18n="f_customer_class">客户分类</span><span class="auto-label">系统自带</span></label><input class="auto" value="A类（重点客户）" disabled></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_customer_model">客户模型</span><span class="auto-label">系统自带</span></label><input class="auto" value="长期合作型" disabled></div>
          <div class="form-group"><label><span data-i18n="f_pain_points">需求痛点</span><span class="auto-label">系统自带</span></label><input class="auto" value="交期稳定性、品质一致性" disabled></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_segment">所属行业/细分领域</span><span class="auto-label synced">云平台同步</span></label><input class="auto synced" value="消费电子 — 智能家居" disabled></div>
          <div class="form-group"><label><span data-i18n="f_personality">性格特征</span><span class="auto-label synced">云平台同步</span></label><input class="auto synced" value="理性决策型，注重数据" disabled></div>
        </div>
      </div>

      <!-- 自定义字段 -->
      <div class="form-section">
        <div class="form-section-title"><span class="sec-icon">⚙️</span> <span data-i18n="sec_custom">自定义字段</span></div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_follow">是否关注</span></label><div class="checkbox-row"><input type="checkbox" checked><span data-i18n="f_follow_hint">关注此联系人</span></div></div>
          <div class="form-group"><label><span data-i18n="f_last_note">最后联系备注</span></label><input type="text" value="已发送报价方案，等待客户回复"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label><span data-i18n="f_last_contact">最近联系时间</span><span class="auto-label">系统自带</span></label><input class="auto" value="2026-06-14 16:45" disabled></div>
          <div class="form-group"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">

  document.getElementById('langZh').classList.toggle('active',lang==='zh-CN');
  document.getElementById('langEn').classList.toggle('active',lang==='en');
  const d=i18n[lang];if(!d)return;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(d[k])el.innerHTML=d[k];});
