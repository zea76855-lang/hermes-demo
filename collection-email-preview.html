<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection Email Preview</title>
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --text:#111827; --muted:#6b7280; --brand:#f05a4e; --border:#e5e7eb; --soft:#fff7f6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1180px; margin:0 auto; padding:32px 20px 48px; }
    h1 { margin:0; font-size:28px; }
    .sub { margin:8px 0 0; color:var(--muted); }
    .hint-top { margin-top:10px; color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:280px 1fr; gap:20px; margin-top:20px; align-items:start; }
    .sidebar,.preview { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 24px rgba(17,24,39,.05); }
    .sidebar { padding:16px; position:sticky; top:20px; height:fit-content; }
    .btn { display:block; width:100%; padding:14px 16px; margin-bottom:10px; border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--text); text-decoration:none; font-weight:600; transition:.18s; }
    .group-title { font-size:12px; font-weight:700; letter-spacing:.02em; color:#374151; text-transform:uppercase; margin:0 0 10px; }
    .btn:hover,.btn.active { border-color:var(--brand); color:var(--brand); background:var(--soft); }
    .meta { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:13px; line-height:1.7; }
    .toolbar { display:flex; gap:12px; flex-wrap:wrap; padding:16px; border-bottom:1px solid var(--border); align-items:flex-start; justify-content:space-between; }
    .title-block { min-width:0; }
    .path { color:var(--muted); font-size:13px; word-break:break-all; margin-bottom:8px; }
    .subject-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .subject-badge { display:block; max-width:100%; padding:0; border-radius:0; background:transparent; color:var(--muted); border:0; font-size:12px; font-weight:700; line-height:1.35; word-break:break-word; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .open,.copy { color:#fff; background:var(--brand); padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:600; border:0; cursor:pointer; }
    .copy { background:#111827; }
    .copy.done { background:#0f766e; }
    .mail-host { padding:0; overflow:visible; }
    .mail-frame { width:100%; border:0; display:block; background:#fff; border-radius:0 0 16px 16px; }
    @media (max-width:900px){ .grid{grid-template-columns:1fr;} .sidebar{position:static;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Credit Center Email Preview</h1>
      <p class="sub">仅展示 6 个催收邮件模板在线预览</p>
      <div class="hint-top">提示：右上角“下载 HTML”会下载当前预览的文件。</div>
    </div>

    <div class="grid">
      <aside class="sidebar">
        <div class="group-title">催收邮件</div>
        <a class="btn active" href="01-pre-due-5days.html?v=202607312" data-src="01-pre-due-5days.html" data-label="D-5 到期前提醒邮件">D-5 到期前提醒邮件</a>
<a class="btn" href="02-due-today.html?v=202607312" data-src="02-due-today.html" data-label="D0 到期当天提醒邮件">D0 到期当天提醒邮件</a>
<a class="btn" href="03-overdue-5days.html?v=202607312" data-src="03-overdue-5days.html" data-label="D+5 逾期提醒邮件">D+5 逾期提醒邮件</a>
<a class="btn" href="04-overdue-10days.html?v=202607312" data-src="04-overdue-10days.html" data-label="D+10 逾期提醒邮件">D+10 逾期提醒邮件</a>
<a class="btn" href="05-overdue-20days.html?v=202607312" data-src="05-overdue-20days.html" data-label="D+20 逾期提醒邮件">D+20 逾期提醒邮件</a>
<a class="btn" href="06-overdue-30days.html?v=202607312" data-src="06-overdue-30days.html" data-label="D+30 逾期提醒邮件">D+30 逾期提醒邮件</a>
        <div class="meta">
          <div><strong>在线入口：</strong></div>
          <div>本页面仅展示 6 个模板。</div>
          <div>文件均已部署到同一 Pages 目录。</div>
        </div>
      </aside>

      <main class="preview">
        <div class="toolbar">
          <div class="title-block">
            <div class="path" id="path">Submitted - 审核中</div>
            <div class="subject-row">
              <div class="subject-badge" id="subject">Subject: Your Credit Application Is Under Review</div>
            </div>
          </div>
          <div class="actions">
            <a class="open" id="openLink" href="2d786767bbbeae53.html?v=202607312" target="_blank">新窗口打开</a>
            <button class="copy" id="copyBtn" type="button">复制 Subject</button>
            <a class="open" id="downloadLink" href="2d786767bbbeae53.html" download="credit-application-submitted.html">下载 HTML</a>
          </div>
        </div>
        <div class="mail-host" id="mailHost"></div>
      </main>
    </div>
  </div>

  <script>
    const buttons = document.querySelectorAll('.btn');
    const path = document.getElementById('path');
    const subject = document.getElementById('subject');
    const openLink = document.getElementById('openLink');
    const downloadLink = document.getElementById('downloadLink');
    const copyBtn = document.getElementById('copyBtn');
    const mailHost = document.getElementById('mailHost');
    const cacheV = '202607312';
    const map = {
      '01-pre-due-5days.html': { label: 'D-5 到期前提醒邮件', subject: '[Friendly Payment Reminder] Your Order Payment is About to Be Due, Please Arrange in Advance', filename: '01-pre-due-5days.html' },
      '02-due-today.html': { label: 'D0 到期当天提醒邮件', subject: '[Payment Reminder] Payment Due Today, Please Arrange Payment', filename: '02-due-today.html' },
      '03-overdue-5days.html': { label: 'D+5 逾期提醒邮件', subject: '[Kind Reminder] Payment Overdue by 5 Days, Request for Payment Plan', filename: '03-overdue-5days.html' },
      '04-overdue-10days.html': { label: 'D+10 逾期提醒邮件', subject: '[Official Payment Reminder] Account Overdue by 10 Days, Please Settle Payment Within the Deadline', filename: '04-overdue-10days.html' },
      '05-overdue-20days.html': { label: 'D+20 逾期提醒邮件', subject: '[Urgent Collection Letter] Account Overdue by 20 Days, Please Settle the Outstanding Amount Within 3 Working Days', filename: '05-overdue-20days.html' },
      '06-overdue-30days.html': { label: 'D+30 逾期提醒邮件', subject: '[Final Warning Letter] Overdue 30 Days, Cancellation of Monthly Credit, Suspension of Pending Orders, Soon to Be Referred to Legal Department', filename: '06-overdue-30days.html' },
    };

    function setBodyHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const body = doc.body.cloneNode(true);
      body.style.margin = '0';
      body.style.background = '#fff';
      body.style.overflow = 'visible';
      body.querySelectorAll('a').forEach(a => { a.target = '_blank'; });
      mailHost.innerHTML = '';
      mailHost.appendChild(body);
    }

    async function loadMail(src) {
      const res = await fetch('./' + src + '?v=' + cacheV, { cache: 'no-store' });
      const html = await res.text();
      setBodyHtml(html);
    }

    async function activate(btn) {
      buttons.forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      const src = btn.dataset.src;
      const meta = map[src];
      const url = './' + src + '?v=' + cacheV;
      path.textContent = meta.label;
      subject.textContent = 'Subject: ' + meta.subject;
      openLink.href = url;
      downloadLink.href = './' + src;
      downloadLink.setAttribute('download', meta.filename);
      copyBtn.dataset.subject = meta.subject;
      await loadMail(src);
    }

    copyBtn.addEventListener('click', async () => {
      const text = copyBtn.dataset.subject || '';
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = '已复制';
        copyBtn.classList.add('done');
        setTimeout(() => {
          copyBtn.textContent = '复制 Subject';
          copyBtn.classList.remove('done');
        }, 1200);
      } catch (e) {
        copyBtn.textContent = '复制失败';
        setTimeout(() => { copyBtn.textContent = '复制 Subject'; }, 1200);
      }
    });

    buttons.forEach(btn => btn.addEventListener('click', e => { e.preventDefault(); activate(btn); }));
    copyBtn.dataset.subject = map['01-pre-due-5days.html'].subject;
    loadMail('01-pre-due-5days.html');
  </script>
</body>
</html>
