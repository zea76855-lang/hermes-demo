<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Application Email Preview</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#1f2937;--muted:#6b7280;--brand:#ff6b5c;--brand2:#ff8a7a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .top{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:1400px;margin:0 auto;padding:18px 24px}
    .title{font-size:28px;font-weight:800;margin:0 0 6px}.sub{color:var(--muted);font-size:13px}
    .main{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px 24px 28px;max-width:1400px;margin:0 auto}
    .side,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.05)}
    .side{padding:14px}.btn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0;color:var(--text);text-decoration:none;cursor:pointer;font-size:14px;line-height:1.35}.btn.active{border-color:var(--brand);background:linear-gradient(180deg,#fff,#fff4f2);box-shadow:0 0 0 1px rgba(255,107,92,.08)}
    .panel{overflow:visible}.panel-hd{padding:18px 20px;border-bottom:1px solid var(--line)}.crumb{font-size:12px;color:var(--muted)}.subject{margin-top:8px;font-size:18px;font-weight:800;color:#111827}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.act{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}.act.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .mail-host{padding:18px 20px 26px;overflow:visible}.mail-box{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:visible;max-width:860px;margin:0 auto}.mail-inner{width:100%;display:block}
    .hint{margin-top:10px;color:var(--muted);font-size:12px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (max-width: 1100px){.main{grid-template-columns:1fr}.side{order:2}}
  </style>
</head>
<body>
  <div class="top"><div class="wrap"><h1 class="title">Credit Application Email Preview</h1><div class="sub">提示：右上角可新窗口打开、复制 Subject、下载 HTML。</div></div></div>
  <div class="main">
    <aside class="side" id="nav">
      <a class="btn active" href="credit-application-open.html?v=202607324" data-src="credit-application-open.html" data-label="Open - 入口开放通知">Open - 入口开放通知</a>
      <a class="btn" href="credit-application-submitted.html?v=202607324" data-src="credit-application-submitted.html" data-label="Submitted - 审核中">Submitted - 审核中</a>
      <a class="btn" href="credit-application-approved.html?v=202607324" data-src="credit-application-approved.html" data-label="Approved - 已批准">Approved - 已批准</a>
      <a class="btn" href="credit-application-declined.html?v=202607324" data-src="credit-application-declined.html" data-label="Declined - 已拒绝">Declined - 已拒绝</a>
    </aside>
    <section class="panel">
      <div class="panel-hd">
        <div class="crumb" id="path">Open - 入口开放通知</div>
        <div class="subject" id="subject">Subject: Your RapidDirect Credit Application Access Is Now Available</div>
        <div class="actions">
          <a class="act primary" id="openLink" href="credit-application-open.html?v=202607324" target="_blank">新窗口打开</a>
          <button class="act" id="copyBtn" type="button">复制 Subject</button>
          <a class="act" id="downloadLink" href="credit-application-open.html" download="credit-application-open.html">下载 HTML</a>
        </div>
      </div>
      <div class="mail-host" id="mailHost"><div class="mail-box"><div class="mail-inner" id="mailInner"></div></div></div>
    </section>
  </div>
<script>
const map={
  'credit-application-open.html':{label:'Open - 入口开放通知',subject:'Your RapidDirect Credit Application Access Is Now Available',filename:'credit-application-open.html'},
  'credit-application-submitted.html':{label:'Submitted - 审核中',subject:'Your Credit Application Is Under Review',filename:'credit-application-submitted.html'},
  'credit-application-approved.html':{label:'Approved - 已批准',subject:'Your Credit Application Has Been Approved',filename:'credit-application-approved.html'},
  'credit-application-declined.html':{label:'Declined - 已拒绝',subject:'Update on Your Credit Application',filename:'credit-application-declined.html'}
};
const cacheV='202607324';
const buttons=[...document.querySelectorAll('.btn')];
const path=document.getElementById('path');
const subject=document.getElementById('subject');
const openLink=document.getElementById('openLink');
const downloadLink=document.getElementById('downloadLink');
const copyBtn=document.getElementById('copyBtn');
const mailInner=document.getElementById('mailInner');
async function loadMail(src){
  const url='./'+src+'?v='+cacheV;
  const res=await fetch(url,{cache:'no-store'});
  const html=await res.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  const body=doc.body;
  mailInner.innerHTML=body ? body.innerHTML : html;
}
async function activate(btn){
  buttons.forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const src=btn.dataset.src; const meta=map[src]; const url='./'+src+'?v='+cacheV;
  path.textContent=meta.label; subject.textContent='Subject: '+meta.subject;
  openLink.href=url; downloadLink.href='./'+src; downloadLink.setAttribute('download', meta.filename);
  copyBtn.dataset.subject=meta.subject;
  await loadMail(src);
}
copyBtn.addEventListener('click', async ()=>{const text=copyBtn.dataset.subject||'';try{await navigator.clipboard.writeText(text);copyBtn.textContent='已复制';setTimeout(()=>copyBtn.textContent='复制 Subject',1200);}catch(e){copyBtn.textContent='复制失败';setTimeout(()=>copyBtn.textContent='复制 Subject',1200);}});
buttons.forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();activate(btn);}));
copyBtn.dataset.subject=map['credit-application-open.html'].subject;
activate(buttons[0]);
</script>
</body>
</html>
