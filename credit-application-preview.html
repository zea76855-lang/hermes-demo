<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Application Email Preview</title>
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --text:#111827; --muted:#6b7280; --brand:#f05a4e; --border:#e5e7eb; --soft:#fff7f6; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:1180px; margin:0 auto; padding:32px 20px 48px; }
    h1 { margin:0; font-size:28px; }
    .sub { margin:8px 0 0; color:var(--muted); }
    .grid { display:grid; grid-template-columns:280px 1fr; gap:20px; margin-top:20px; align-items:start; }
    .sidebar,.preview { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 24px rgba(17,24,39,.05); }
    .sidebar { padding:16px; position:sticky; top:20px; height:fit-content; }
    .btn { display:block; width:100%; padding:14px 16px; margin-bottom:10px; border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--text); text-decoration:none; font-weight:600; }
    .btn.active { border-color:var(--brand); color:var(--brand); background:var(--soft); }
    .meta { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:13px; line-height:1.7; }
    .toolbar { display:flex; gap:12px; flex-wrap:wrap; padding:16px; border-bottom:1px solid var(--border); align-items:flex-start; justify-content:space-between; }
    .path { color:var(--muted); font-size:13px; word-break:break-all; margin-bottom:8px; }
    .subject-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .subject-badge { color:var(--muted); font-size:12px; font-weight:700; line-height:1.35; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .open,.copy { color:#fff; background:var(--brand); padding:10px 14px; border-radius:10px; text-decoration:none; font-weight:600; border:0; cursor:pointer; }
    .copy { background:#111827; }
    .copy.done { background:#0f766e; }
    .mail-host { padding:0; }
    .mail-frame { width:100%; border:0; display:block; background:#fff; min-height:980px; }
    @media (max-width:900px){ .grid{grid-template-columns:1fr;} .sidebar{position:static;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Credit Application Email Preview</h1>
      <p class="sub">仅展示 4 个信用申请邮件模板在线预览</p>
    </div>
    <div class="grid">
      <aside class="sidebar">
        <div class="group-title" style="font-size:12px;font-weight:700;letter-spacing:.02em;color:#374151;text-transform:uppercase;margin:0 0 10px;">信用申请</div>
        <a class="btn active" href="credit-application-open.html?v=202607314" data-src="credit-application-open.html" data-label="Open - 开通通知">Open - 开通通知</a>
        <a class="btn" href="2d786767bbbeae53.html?v=202607314" data-src="2d786767bbbeae53.html" data-label="Submitted - 审核中">Submitted - 审核中</a>
        <a class="btn" href="2da1bc035b96441c.html?v=202607314" data-src="2da1bc035b96441c.html" data-label="Approved - 已批准">Approved - 已批准</a>
        <a class="btn" href="5202fc81861bfb05.html?v=202607314" data-src="5202fc81861bfb05.html" data-label="Declined - 已拒绝">Declined - 已拒绝</a>
        <div class="meta">
          <div><strong>在线入口：</strong></div>
          <div>本页面仅展示 4 个模板。</div>
          <div>文件均已部署到同一 Pages 目录。</div>
        </div>
      </aside>
      <main class="preview">
        <div class="toolbar">
          <div>
            <div class="path" id="path">Open - 开通通知</div>
            <div class="subject-row"><div class="subject-badge" id="subject">Subject: Your RapidDirect Credit Application Access Is Now Available</div></div>
          </div>
          <div class="actions">
            <a class="open" id="openLink" href="credit-application-open.html?v=202607314" target="_blank">新窗口打开</a>
            <button class="copy" id="copyBtn" type="button">复制 Subject</button>
            <a class="open" id="downloadLink" href="credit-application-open.html" download="credit-application-open.html">下载 HTML</a>
          </div>
        </div>
        <div class="mail-host" id="mailHost">
          <iframe class="mail-frame" id="mailFrame" src="credit-application-open.html?v=202607314"></iframe>
        </div>
      </main>
    </div>
  </div>
  <script>
    const map = {
      'credit-application-open.html': { label: 'Open - 开通通知', subject: 'Your RapidDirect Credit Application Access Is Now Available', filename: 'credit-application-open.html' },
      'fa7be5ea850e4329.html': { label: 'Submitted - 审核中', subject: 'Your Credit Application Is Under Review', filename: 'credit-application-submitted.html' },
      '3f5266c7bdd3b687.html': { label: 'Approved - 已批准', subject: 'Your Credit Application Has Been Approved', filename: 'credit-application-approved.html' },
      '265a05d28fdf88cd.html': { label: 'Declined - 已拒绝', subject: 'Update on Your Credit Application', filename: 'credit-application-declined.html' },
    };
    const buttons=document.querySelectorAll('.btn');
    const path=document.getElementById('path');
    const subject=document.getElementById('subject');
    const openLink=document.getElementById('openLink');
    const downloadLink=document.getElementById('downloadLink');
    const copyBtn=document.getElementById('copyBtn');
    const frame=document.getElementById('mailFrame');
    const cacheV='202607314';
    async function activate(btn){
      buttons.forEach(b=>b.classList.remove('active')); btn.classList.add('active');
      const src=btn.dataset.src; const meta=map[src]; const url='./'+src+'?v='+cacheV;
      path.textContent=meta.label; subject.textContent='Subject: '+meta.subject;
      openLink.href=url; downloadLink.href='./'+src; downloadLink.setAttribute('download', meta.filename);
      copyBtn.dataset.subject=meta.subject; frame.src=url;
    }
    copyBtn.addEventListener('click', async ()=>{ const text=copyBtn.dataset.subject||''; try{ await navigator.clipboard.writeText(text); copyBtn.textContent='已复制'; setTimeout(()=>copyBtn.textContent='复制 Subject',1200);}catch(e){ copyBtn.textContent='复制失败'; setTimeout(()=>copyBtn.textContent='复制 Subject',1200);} });
    buttons.forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();activate(btn);}));
    copyBtn.dataset.subject=map['credit-application-open.html'].subject;
  </script>
</body>
</html>
